{
  "version": 1,
  "hosts": {
    "pi5": {
      "ssh": "pi",
      "postgres_container": "postgres",
      "couchdb_container": "couchdb",
      "rustfs_container": "rustfs"
    },
    "vm100": {
      "ssh": "ubuntu@10.10.0.31",
      "gitlab_container_pattern": "gitlab_gitlab"
    }
  },
  "storage": {
    "local_root": "/ssd-data/infra/backups/homelab",
    "drive_remote": "gdrive",
    "drive_root": "homelab-backups",
    "restic_password_file": "/ssd-data/infra/backup/secrets/restic-password",
    "mezon_webhook_file": "/ssd-data/infra/backup/secrets/mezon-webhook"
  },
  "postgresql": {
    "host": "pi5",
    "container": "postgres",
    "admin_user": "admin",
    "databases": [
      {"name": "bds_prod", "application": "bds", "lifecycle": "active"},
      {"name": "family_tree", "application": "family-tree", "lifecycle": "active"},
      {"name": "gitlabhq_production", "application": "gitlab", "lifecycle": "active"},
      {"name": "goclaw", "application": "goclaw", "lifecycle": "retired"},
      {"name": "homelab", "application": "homelab", "lifecycle": "active"},
      {"name": "macocr", "application": "ocr", "lifecycle": "active"},
      {"name": "mypocket", "application": "mypocket", "lifecycle": "active"},
      {"name": "n8n", "application": "n8n", "lifecycle": "active"},
      {"name": "netbird", "application": "netbird", "lifecycle": "active"},
      {"name": "netbird_activity", "application": "netbird", "lifecycle": "active"},
      {"name": "netbird_idp", "application": "netbird", "lifecycle": "active"},
      {"name": "omniscan", "application": "omniscan", "lifecycle": "retired"},
      {"name": "postgres", "application": "postgresql", "lifecycle": "system"},
      {"name": "relayhub", "application": "relayhub", "lifecycle": "active"}
    ]
  },
  "couchdb": {
    "host": "pi5",
    "container": "couchdb",
    "databases": [
      {"name": "_global_changes", "application": "couchdb", "lifecycle": "system"},
      {"name": "_replicator", "application": "couchdb", "lifecycle": "system"},
      {"name": "_users", "application": "couchdb", "lifecycle": "system"},
      {"name": "homelab", "application": "homelab", "lifecycle": "active"},
      {"name": "obsidian_vault", "application": "obsidian", "lifecycle": "active"}
    ]
  },
  "rustfs": {
    "host": "pi5",
    "container": "rustfs",
    "endpoint": "http://rustfs:9000",
    "buckets": [
      {"name": "family-tree", "application": "family-tree", "lifecycle": "active"},
      {"name": "goclaw", "application": "goclaw", "lifecycle": "retired"},
      {"name": "mac-ocr", "application": "ocr", "lifecycle": "active"},
      {"name": "mypocket", "application": "mypocket", "lifecycle": "active"},
      {"name": "obsidian", "application": "obsidian", "lifecycle": "active"},
      {"name": "qn-office", "application": "qn-office", "lifecycle": "active"},
      {"name": "registry-data", "application": "registry", "lifecycle": "active"},
      {"name": "whiteboard", "application": "whiteboard", "lifecycle": "active"}
    ]
  },
  "gitlab": {
    "host": "vm100",
    "container_pattern": "gitlab_gitlab",
    "version": "18.11.11",
    "application": "gitlab"
  }
}
