apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/part-of: aws-saa-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/part-of: aws-saa-lab
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: edge
              containerPort: 4566
            - name: ext-4510
              containerPort: 4510
            - name: ext-4511
              containerPort: 4511
            - name: ext-4512
              containerPort: 4512
            - name: ext-4513
              containerPort: 4513
            - name: ext-4514
              containerPort: 4514
            - name: ext-4515
              containerPort: 4515
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: DEBUG
              value: "0"
            - name: PERSISTENCE
              value: "1"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: localstack-data
