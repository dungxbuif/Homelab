services:
  gitlab:
    image: gitlab/gitlab-ce:18.11.11-ce.0
    hostname: gitlab.dungxbuif.com
    environment:
      GITLAB_OMNIBUS_CONFIG: "from_file('/omnibus_config.rb')"
    configs:
      - source: gitlab_omnibus_registry_trial_20260916
        target: /omnibus_config.rb
    secrets:
      - gitlab_db_password
      - gitlab_redis_password
      - gitlab_root_password
    volumes:
      - type: bind
        source: /opt/apps/gitlab/config
        target: /etc/gitlab
      - type: bind
        source: /opt/apps/gitlab/logs
        target: /var/log/gitlab
      - type: bind
        source: /opt/apps/gitlab/data
        target: /var/opt/gitlab
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 268435456
    networks:
      - homelab-net
    stop_grace_period: 3m
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == vm100-prod
      restart_policy:
        condition: any
        delay: 15s
      resources:
        limits:
          cpus: "4.0"
          memory: 10G
        reservations:
          cpus: "1.0"
          memory: 2G

configs:
  gitlab_omnibus_registry_trial_20260916:
    file: ./gitlab-omnibus.rb

secrets:
  gitlab_db_password:
    external: true
  gitlab_redis_password:
    external: true
  gitlab_root_password:
    external: true

networks:
  homelab-net:
    external: true
