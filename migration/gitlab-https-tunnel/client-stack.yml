version: "3.8"

services:
  client:
    image: rapiz1/rathole@sha256:a31b9178e985d4a84f46d4c3af6aa200ee0c5e7f821c7075a1f6669fb77392b1
    command: ["--client", "/run/secrets/gitlab_https_tunnel_client"]
    secrets:
      - gitlab_https_tunnel_client
    networks:
      - homelab-net
    deploy:
      placement:
        constraints: [node.hostname == vm100-prod]
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

secrets:
  gitlab_https_tunnel_client:
    external: true

networks:
  homelab-net:
    external: true
