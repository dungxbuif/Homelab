services:
  rathole:
    image: rapiz1/rathole@sha256:a31b9178e985d4a84f46d4c3af6aa200ee0c5e7f821c7075a1f6669fb77392b1
    container_name: gitlab-https-rathole-server
    command: ["--server", "/app/config.toml"]
    restart: unless-stopped
    ports:
      - "7002:7002/tcp"
    volumes:
      - ./runtime/server.toml:/app/config.toml:ro
    networks:
      - gateway-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=gateway-network
      - traefik.http.routers.gitlab-temp.rule=Host(`gitlab.dungxbuif.com`)
      - traefik.http.routers.gitlab-temp.entrypoints=websecure
      - traefik.http.routers.gitlab-temp.tls=true
      - traefik.http.routers.gitlab-temp.tls.certresolver=letsencrypt
      - traefik.http.routers.gitlab-temp.service=gitlab-temp
      - traefik.http.services.gitlab-temp.loadbalancer.server.port=8085
    mem_limit: 128m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway-network:
    external: true
