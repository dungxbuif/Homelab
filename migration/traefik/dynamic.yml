http:
  middlewares:
    storage-cors:
      headers:
        accessControlAllowOriginList:
          - "*"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true
        customResponseHeaders:
          Access-Control-Allow-Private-Network: "true"
    lan-only:
      ipAllowList:
        sourceRange:
          - 10.10.0.0/24
          - 10.66.66.0/24
          - 10.0.0.0/24

  routers:
    homepage:
      rule: Host(`dungxbuif.com`) || Host(`www.dungxbuif.com`)
      entryPoints: [websecure]
      service: homepage
      tls: &wildcard-tls
        certResolver: letsencrypt
        domains:
          - main: "*.dungxbuif.com"
            sans:
              - dungxbuif.com
    cdn:
      rule: Host(`cdn.dungxbuif.com`)
      entryPoints: [websecure]
      service: cdn
      tls: *wildcard-tls
    storage:
      rule: Host(`storage.dungxbuif.com`)
      entryPoints: [websecure]
      middlewares: [storage-cors]
      service: storage
      tls: *wildcard-tls
    registry:
      rule: Host(`registry.dungxbuif.com`)
      entryPoints: [websecure]
      service: registry
      tls: *wildcard-tls
    speedtest:
      rule: Host(`speed.dungxbuif.com`)
      entryPoints: [websecure]
      service: speedtest
      tls: *wildcard-tls
    pgadmin:
      rule: Host(`pgadmin.dungxbuif.com`)
      entryPoints: [websecure]
      service: pgadmin
      tls: *wildcard-tls
    couchdb:
      rule: Host(`couchdb.dungxbuif.com`) || Host(`sync-db.dungxbuif.com`)
      entryPoints: [websecure]
      service: couchdb
      tls: *wildcard-tls
    llm:
      rule: Host(`llm.dungxbuif.com`)
      entryPoints: [websecure]
      service: llm
      tls: *wildcard-tls
    ocr:
      rule: Host(`ocr.dungxbuif.com`)
      entryPoints: [websecure]
      service: ocr
      tls: *wildcard-tls
    money:
      rule: Host(`money.dungxbuif.com`)
      entryPoints: [websecure]
      service: money
      tls: *wildcard-tls
    mezonhook:
      rule: Host(`mezonhook.dungxbuif.com`)
      entryPoints: [websecure]
      service: mezonhook
      tls: *wildcard-tls
    family:
      rule: Host(`family.dungxbuif.com`)
      entryPoints: [websecure]
      service: family
      tls: *wildcard-tls
    openclaw:
      rule: Host(`openclaw.dungxbuif.com`)
      entryPoints: [websecure]
      service: openclaw
      tls: *wildcard-tls
    n8n:
      rule: Host(`n8n.dungxbuif.com`)
      entryPoints: [websecure]
      service: n8n
      tls: *wildcard-tls
    gitlab:
      rule: Host(`gitlab.dungxbuif.com`)
      entryPoints: [websecure]
      service: gitlab
      tls: *wildcard-tls
    relayhub:
      rule: Host(`relayhub.dungxbuif.com`)
      entryPoints: [websecure]
      service: relayhub
      tls: *wildcard-tls
    netbird-grpc:
      rule: Host(`netbird.dungxbuif.com`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      entryPoints: [websecure]
      service: netbird-server-h2c
      priority: 100
      tls: *wildcard-tls
    netbird-backend:
      rule: Host(`netbird.dungxbuif.com`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      entryPoints: [websecure]
      service: netbird-server
      priority: 100
      tls: *wildcard-tls
    netbird-dashboard:
      rule: Host(`netbird.dungxbuif.com`)
      entryPoints: [websecure]
      service: netbird-dashboard
      priority: 1
      tls: *wildcard-tls

  services:
    homepage:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.homepage:80
    cdn:
      loadBalancer:
        servers:
          - url: http://rustfs:9001
    storage:
      loadBalancer:
        servers:
          - url: http://rustfs:9000
    registry:
      loadBalancer:
        servers:
          - url: http://registry:5000
    speedtest:
      loadBalancer:
        servers:
          - url: http://librespeed:80
    pgadmin:
      loadBalancer:
        servers:
          - url: http://pgadmin:80
    couchdb:
      loadBalancer:
        servers:
          - url: http://couchdb:5984
    llm:
      loadBalancer:
        servers:
          - url: http://10.10.0.6:1234
    ocr:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.macocr-proxy:8080
    money:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.mypocket-web:80
    mezonhook:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.mezonhook:8080
    family:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.family-tree:3000
    openclaw:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.openclaw:18789
    n8n:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.n8n:5678
    gitlab:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.gitlab_gitlab:80
    relayhub:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.relayhub:8080
    netbird-server:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.netbird-server:80
    netbird-server-h2c:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: h2c://tasks.netbird-server:80
    netbird-dashboard:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://tasks.netbird-dashboard:80
