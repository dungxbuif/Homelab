services:
  rathole:
    image: rapiz1/rathole@sha256:a31b9178e985d4a84f46d4c3af6aa200ee0c5e7f821c7075a1f6669fb77392b1
    container_name: gitlab-ssh-rathole-server
    command: ["--server", "/app/config.toml"]
    restart: unless-stopped
    ports:
      - "7001:7001/tcp"
      - "2222:2222/tcp"
    volumes:
      - ./runtime/server.toml:/app/config.toml:ro
    mem_limit: 128m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
