# Orange Pi edge - canonical Swarm stack (Traefik + Rathole + AdGuard Home)
#
# Placement: edge=true label on the Orange Pi worker.
# Network: homelab-net attachable overlay, created outside this stack.
# Deployment requires CF_DNS_API_TOKEN in the operator environment.

version: "3.8"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      - CF_DNS_API_TOKEN
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      - /opt/edge/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/edge/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /opt/edge/traefik/test-letsencrypt:/letsencrypt
    networks:
      - homelab-net
    deploy:
      placement:
        constraints: [node.labels.edge == true]
      replicas: 1
      restart_policy:
        condition: any

  rathole:
    image: rathole:local
    command: ["/etc/rathole/rathole.toml"]
    volumes:
      - /opt/edge/rathole/rathole.toml:/etc/rathole/rathole.toml:ro
    networks:
      - homelab-net
    deploy:
      placement:
        constraints: [node.labels.edge == true]
      replicas: 1
      restart_policy:
        condition: any

  adguardhome:
    image: adguard/adguardhome:latest
    ports:
      - target: 53
        published: 53
        protocol: udp
        mode: host
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 81
        published: 81
        protocol: tcp
        mode: host
    volumes:
      - /opt/edge/adguard/conf:/opt/adguardhome/conf
      - /opt/edge/adguard/work:/opt/adguardhome/work
    networks:
      - homelab-net
    deploy:
      placement:
        constraints: [node.labels.edge == true]
      replicas: 1
      restart_policy:
        condition: any

networks:
  homelab-net:
    external: true
