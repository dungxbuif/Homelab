apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktunnel-server
  namespace: ktunnel
  labels:
    app: ktunnel-server
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ktunnel-server
  template:
    metadata:
      labels:
        app: ktunnel-server
        component: server
    spec:
      serviceAccountName: ktunnel-server
      containers:
      - name: ktunnel-server
        image: omrikiei/ktunnel:v1.6.1
        command: ["ktunnel"]
        args: 
          - "server"
          - "--port=8000"
          - "--verbose"
        ports:
        - containerPort: 8000
          name: ktunnel-port
          protocol: TCP
        env:
        - name: KTUNNEL_LOG_LEVEL
          value: "info"
        - name: KTUNNEL_PORT
          value: "8000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ktunnel-server-service
  namespace: ktunnel
  labels:
    app: ktunnel-server
    component: service
spec:
  selector:
    app: ktunnel-server
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: ktunnel-api
  type: ClusterIP
