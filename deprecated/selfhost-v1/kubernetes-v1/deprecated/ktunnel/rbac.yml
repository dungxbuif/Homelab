apiVersion: v1
kind: ServiceAccount
metadata:
  name: ktunnel-server
  namespace: ktunnel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ktunnel
  name: ktunnel-server
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ktunnel-server
  namespace: ktunnel
subjects:
- kind: ServiceAccount
  name: ktunnel-server
  namespace: ktunnel
roleRef:
  kind: Role
  name: ktunnel-server
  apiGroup: rbac.authorization.k8s.io
