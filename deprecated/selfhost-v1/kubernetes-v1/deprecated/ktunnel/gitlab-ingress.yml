# GitLab Web Ingress
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-web-ingress
  namespace: ktunnel
  labels:
    app: gitlab-tunnel
    component: web-ingress
    tunnel-type: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitlab.dungxbuif.com`)
      kind: Rule
      services:
        - name: gitlab-web
          port: 80
  tls: {}
---
# GitLab Registry Ingress
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitlab-registry-ingress
  namespace: ktunnel
  labels:
    app: gitlab-tunnel
    component: registry-ingress
    tunnel-type: gitlab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.gitlab.dungxbuif.com`)
      kind: Rule
      services:
        - name: gitlab-registry
          port: 5000
  tls: {}
---
# GitLab SSH Ingress (TCP)
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitlab-ssh-ingress
  namespace: ktunnel
  labels:
    app: gitlab-tunnel
    component: ssh-ingress
    tunnel-type: gitlab
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitlab-ssh
          port: 22
---
# Ktunnel Server Management Interface
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ktunnel-server-ingress
  namespace: ktunnel
  labels:
    app: ktunnel-server
    component: management-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ktunnel.dungxbuif.com`)
      kind: Rule
      services:
        - name: ktunnel-server-service
          port: 8000
  tls: {}
