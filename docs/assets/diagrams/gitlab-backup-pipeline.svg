<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
  <title id="title">GitLab backup run lifecycle</title>
  <desc id="desc">Eight steps from lock to retention, the cleanup and alert path for any failure before promotion, and four independent checks: sweeper, freshness, monthly restore drill and a fault-injection selftest.</desc>
  <defs><marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2f6fed"/></marker><marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1f9d8b"/></marker><marker id="a-ok" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2413b"/></marker><marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7c5cfc"/></marker><marker id="a-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/></marker><marker id="a-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7b8798"/></marker><style>
.bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.white{fill:#fff}
.small{font:14px sans-serif}.tiny{font:12.5px sans-serif}.body{font:16px sans-serif}.bold{font:700 16px sans-serif}
.head{font:700 21px sans-serif}.title{font:700 30px sans-serif}.pill{font:700 13px sans-serif;letter-spacing:.5px}
.card{stroke-width:2}.edge{fill:#eaf2ff;stroke:#2f6fed}.data{fill:#eafaf6;stroke:#1f9d8b}
.compute{fill:#f1edff;stroke:#7c5cfc}.host{fill:#fff;stroke:#b8c2d1}.note{fill:#fff7e8;stroke:#d97706}
.retired{fill:#fff1f1;stroke:#c2413b}.ops{fill:#ecfdf3;stroke:#16a34a}.ctrl{fill:#fdf2f8;stroke:#db2777}
.flow{fill:none;stroke:#2f6fed;stroke-width:3.5;marker-end:url(#a-blue)}
.dflow{fill:none;stroke:#1f9d8b;stroke-width:3.5;marker-end:url(#a-green)}
.gflow{fill:none;stroke:#16a34a;stroke-width:3.5;marker-end:url(#a-ok)}
.rflow{fill:none;stroke:#c2413b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a-red)}
.pflow{fill:none;stroke:#7c5cfc;stroke-width:3.5;marker-end:url(#a-purple)}
.kflow{fill:none;stroke:#db2777;stroke-width:3.5;marker-end:url(#a-pink)}
.dashed{fill:none;stroke:#7b8798;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a-muted)}
</style></defs>
  <rect class="bg" width="1400" height="740"/>
  <text class="title ink" x="50" y="58">GitLab backup run lifecycle</text>
  <text class="body muted" x="52" y="88">Task 2026-10-31 • native backup → encrypted → Drive • verified before it counts • failure leaves nothing behind</text>
  <rect class="host card" x="50" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="66" y="156">1 Lock</text>
  <text class="small muted" x="66" y="178">flock · one run</text>
  <text class="small muted" x="66" y="198">at a time</text>
  <path class="flow" d="M198 172 H214"/>
  <rect class="host card" x="214" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="230" y="156">2 Preflight</text>
  <text class="small muted" x="230" y="178">readiness · disk</text>
  <text class="small muted" x="230" y="198">Drive quota · version</text>
  <path class="flow" d="M362 172 H378"/>
  <rect class="compute card" x="378" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="394" y="156">3 Backup</text>
  <text class="small muted" x="394" y="178">gitlab-backup create</text>
  <text class="small muted" x="394" y="198">SKIP=registry · slice</text>
  <path class="flow" d="M526 172 H542"/>
  <rect class="ctrl card" x="542" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="558" y="156">4 Encrypt</text>
  <text class="small muted" x="558" y="178">age (key in</text>
  <text class="small muted" x="558" y="198">1Password)</text>
  <path class="flow" d="M690 172 H706"/>
  <rect class="edge card" x="706" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="722" y="156">5 Upload</text>
  <text class="small muted" x="722" y="178">rclone → Drive</text>
  <text class="small muted" x="722" y="198">.partial/&lt;run-id&gt;</text>
  <path class="flow" d="M854 172 H870"/>
  <rect class="data card" x="870" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="886" y="156">6 Verify</text>
  <text class="small muted" x="886" y="178">sha256 vs</text>
  <text class="small muted" x="886" y="198">checksums</text>
  <path class="flow" d="M1018 172 H1034"/>
  <rect class="ops card" x="1034" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="1050" y="156">7 Promote</text>
  <text class="small muted" x="1050" y="178">moveto sets/</text>
  <text class="small muted" x="1050" y="198">COMPLETE last</text>
  <path class="flow" d="M1182 172 H1198"/>
  <rect class="ops card" x="1198" y="130" width="148" height="84" rx="12"/>
  <text class="bold ink" x="1214" y="156">8 Retain</text>
  <text class="small muted" x="1214" y="178">14d · 8w · 6m</text>
  <text class="small muted" x="1214" y="198">+ heartbeat</text>
  <text class="small muted" x="50" y="120">systemd timer 02:00 · hard timeout 45 min · MemoryMax / CPUQuota / ionice so GitLab is never starved</text>
  <rect class="retired card" x="50" y="270" width="1300" height="210" rx="18"/>
  <text class="pill" x="72" y="302" fill="#c2413b">ANY FAILURE BEFORE STEP 7</text>
  <rect class="white card" stroke="#d8dee9" x="72" y="330" width="300" height="130" rx="12"/>
  <text class="bold ink" x="88" y="356">trap EXIT / INT / TERM</text>
  <text class="small muted" x="88" y="378">delete local work dir</text>
  <text class="small muted" x="88" y="398">delete partial files in container</text>
  <text class="small muted" x="88" y="418">delete Drive .partial/&lt;run-id&gt;</text>
  <rect class="white card" stroke="#d8dee9" x="392" y="330" width="300" height="130" rx="12"/>
  <text class="bold ink" x="408" y="356">Alert, never silent</text>
  <text class="small muted" x="408" y="378">Mezon: run-id · step · log tail</text>
  <text class="small muted" x="408" y="398">GitLab issue opened</text>
  <text class="small muted" x="408" y="418">OnFailure= systemd unit</text>
  <rect class="white card" stroke="#d8dee9" x="712" y="330" width="300" height="130" rx="12"/>
  <text class="bold ink" x="728" y="356">Hard timeout</text>
  <text class="small muted" x="728" y="378">TimeoutStartSec kills a hang</text>
  <text class="small muted" x="728" y="398">trap still runs</text>
  <text class="small muted" x="728" y="418">sweeper is the backstop</text>
  <rect class="ops card" x="1032" y="330" width="296" height="130" rx="12"/>
  <text class="bold ink" x="1048" y="356">Result</text>
  <text class="small muted" x="1048" y="378">zero partial files</text>
  <text class="small muted" x="1048" y="398">one alert</text>
  <text class="small muted" x="1048" y="418">previous sets untouched</text>
  <rect class="ops card" x="50" y="510" width="1300" height="200" rx="18"/>
  <text class="pill" x="72" y="542" fill="#15803d">INDEPENDENT CHECKS</text>
  <rect class="white card" stroke="#d8dee9" x="72" y="570" width="300" height="120" rx="12"/>
  <text class="bold ink" x="88" y="596">Sweeper (daily)</text>
  <text class="small muted" x="88" y="618">allow-listed paths + run-id pattern</text>
  <text class="small muted" x="88" y="638">dry-run default · max 3 deletes</text>
  <text class="small muted" x="88" y="658">never the newest verified set</text>
  <rect class="white card" stroke="#d8dee9" x="392" y="570" width="300" height="120" rx="12"/>
  <text class="bold ink" x="408" y="596">Freshness (on VM110)</text>
  <text class="small muted" x="408" y="618">newest COMPLETE older than 26 h</text>
  <text class="small muted" x="408" y="638">size ±30% · counts drop</text>
  <text class="small muted" x="408" y="658">→ Mezon + issue</text>
  <rect class="white card" stroke="#d8dee9" x="712" y="570" width="300" height="120" rx="12"/>
  <text class="bold ink" x="728" y="596">Restore drill (monthly)</text>
  <text class="small muted" x="728" y="618">restore from DRIVE, isolated</text>
  <text class="small muted" x="728" y="638">checklist · record RTO/RPO</text>
  <text class="small muted" x="728" y="658">destroy in trap + TTL sweep</text>
  <rect class="note card" x="1032" y="570" width="296" height="120" rx="12"/>
  <text class="bold ink" x="1048" y="596">selftest (CI)</text>
  <text class="small muted" x="1048" y="618">kill -9 at each step</text>
  <text class="small muted" x="1048" y="638">disk full · network cut · Drive 401</text>
  <text class="small muted" x="1048" y="658">must end with zero residue</text>
</svg>
