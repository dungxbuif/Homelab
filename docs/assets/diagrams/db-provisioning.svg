<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="title desc">
  <title id="title">Database provisioning</title>
  <desc id="desc">An app declares its data needs in app.yml. A merge request shows the plan, a manual CI job creates the database, credentials, backup job and monitoring, and the vault doc is updated. Rotation, adoption and retirement have their own jobs.</desc>
  <defs><marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2f6fed"/></marker><marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1f9d8b"/></marker><marker id="a-ok" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2413b"/></marker><marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7c5cfc"/></marker><marker id="a-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/></marker><marker id="a-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7b8798"/></marker><style>
.bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.white{fill:#fff}
.small{font:14px sans-serif}.tiny{font:12.5px sans-serif}.body{font:16px sans-serif}.bold{font:700 16px sans-serif}
.head{font:700 21px sans-serif}.title{font:700 30px sans-serif}.pill{font:700 13px sans-serif;letter-spacing:.5px}
.card{stroke-width:2}.edge{fill:#eaf2ff;stroke:#2f6fed}.data{fill:#eafaf6;stroke:#1f9d8b}
.compute{fill:#f1edff;stroke:#7c5cfc}.host{fill:#fff;stroke:#b8c2d1}.note{fill:#fff7e8;stroke:#d97706}
.retired{fill:#fff1f1;stroke:#c2413b}.ops{fill:#ecfdf3;stroke:#16a34a}.ctrl{fill:#fdf2f8;stroke:#db2777}
.flow{fill:none;stroke:#2f6fed;stroke-width:3.5;marker-end:url(#a-blue)}
.dflow{fill:none;stroke:#1f9d8b;stroke-width:3.5;marker-end:url(#a-green)}
.gflow{fill:none;stroke:#16a34a;stroke-width:3.5;marker-end:url(#a-ok)}
.rflow{fill:none;stroke:#c2413b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a-red)}
.pflow{fill:none;stroke:#7c5cfc;stroke-width:3.5;marker-end:url(#a-purple)}
.kflow{fill:none;stroke:#db2777;stroke-width:3.5;marker-end:url(#a-pink)}
.dashed{fill:none;stroke:#7b8798;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a-muted)}
</style></defs>
  <rect class="bg" width="1400" height="750"/>
  <text class="title ink" x="50" y="58">Database provisioning</text>
  <text class="body muted" x="52" y="88">Standard 2026-10-31 • declared in app.yml, applied by CI, never by hand</text>
  <rect class="note card" x="50" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="66" y="156">app.yml needs</text>
  <text class="small muted" x="66" y="178">postgres · redis</text>
  <text class="small muted" x="66" y="198">s3 · couchdb</text>
  <path class="flow" d="M246 178 H271"/>
  <rect class="host card" x="271" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="287" y="156">MR + policy</text>
  <text class="small muted" x="287" y="178">names · extensions</text>
  <text class="small muted" x="287" y="198">backup class</text>
  <path class="flow" d="M467 178 H492"/>
  <rect class="data card" x="492" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="508" y="156">hl plan provision</text>
  <text class="small muted" x="508" y="178">diff vs live</text>
  <text class="small muted" x="508" y="198">comment on MR</text>
  <path class="flow" d="M688 178 H713"/>
  <rect class="ctrl card" x="713" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="729" y="156">provision:&lt;app&gt;</text>
  <text class="small muted" x="729" y="178">manual job</text>
  <text class="small muted" x="729" y="198">deploy runner</text>
  <path class="flow" d="M909 178 H934"/>
  <rect class="ops card" x="934" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="950" y="156">verify</text>
  <text class="small muted" x="950" y="178">connect via secret</text>
  <text class="small muted" x="950" y="198">first backup ok</text>
  <path class="flow" d="M1130 178 H1155"/>
  <rect class="note card" x="1155" y="130" width="196" height="96" rx="12"/>
  <text class="bold ink" x="1171" y="156">vault doc</text>
  <text class="small muted" x="1171" y="178">Data + Secrets</text>
  <text class="small muted" x="1171" y="198">gate G4</text>
  <rect class="ctrl card" x="50" y="270" width="1300" height="300" rx="18"/>
  <text class="pill" x="72" y="302" fill="#be185d">WHAT provision:&lt;app&gt; CREATES (Ansible role db_provision)</text>
  <rect class="white card" stroke="#d8dee9" x="72" y="340" width="300" height="200" rx="12"/>
  <text class="bold ink" x="88" y="366">PostgreSQL (Pi5)</text>
  <text class="small muted" x="88" y="388">role &lt;app&gt; LOGIN, no superuser</text>
  <text class="small muted" x="88" y="408">db &lt;app&gt; + &lt;app&gt;_stg</text>
  <text class="small muted" x="88" y="428">revoke PUBLIC</text>
  <text class="small muted" x="88" y="448">allow-listed extensions</text>
  <text class="small muted" x="88" y="468">PgBouncer auth_query</text>
  <rect class="white card" stroke="#d8dee9" x="390" y="340" width="300" height="200" rx="12"/>
  <text class="bold ink" x="406" y="366">Secrets</text>
  <text class="small muted" x="406" y="388">password generated in job</text>
  <text class="small muted" x="406" y="408">→ 1Password apps/&lt;app&gt;/…</text>
  <text class="small muted" x="406" y="428">→ Swarm secret _vN</text>
  <text class="small muted" x="406" y="448">never in logs / MR</text>
  <rect class="white card" stroke="#d8dee9" x="708" y="340" width="300" height="200" rx="12"/>
  <text class="bold ink" x="724" y="366">Redis / RustFS / CouchDB</text>
  <text class="small muted" x="724" y="388">ACL user ~&lt;app&gt;:*</text>
  <text class="small muted" x="724" y="408">bucket &lt;app&gt;-&lt;name&gt; + key</text>
  <text class="small muted" x="724" y="428">CouchDB db + member</text>
  <text class="small muted" x="724" y="448"></text>
  <rect class="white card" stroke="#d8dee9" x="1026" y="340" width="300" height="200" rx="12"/>
  <text class="bold ink" x="1042" y="366">Backup + monitoring</text>
  <text class="small muted" x="1042" y="388">Databasus job via API</text>
  <text class="small muted" x="1042" y="408">first backup triggered</text>
  <text class="small muted" x="1042" y="428">exporter target</text>
  <text class="small muted" x="1042" y="448">alerts → Mezon</text>
  <rect class="ops card" x="50" y="600" width="420" height="120" rx="12"/>
  <text class="bold ink" x="66" y="626">Rotate (hl rotate)</text>
  <text class="small muted" x="66" y="648">new password → secret _vN+1</text>
  <text class="small muted" x="66" y="668">stack MR + deploy → drop _vN</text>
  <text class="small muted" x="66" y="688">no downtime</text>
  <rect class="data card" x="490" y="600" width="420" height="120" rx="12"/>
  <text class="bold ink" x="506" y="626">Adopt existing (adopt: true)</text>
  <text class="small muted" x="506" y="648">read-only inventory first</text>
  <text class="small muted" x="506" y="668">ensure grants + backup only</text>
  <text class="small muted" x="506" y="688">plan = 0 → adopted</text>
  <rect class="retired card" x="930" y="600" width="420" height="120" rx="12"/>
  <text class="bold ink" x="946" y="626">Retire (deprovision, manual)</text>
  <text class="small muted" x="946" y="648">final backup + restore check</text>
  <text class="small muted" x="946" y="668">revoke + rename _retired_&lt;date&gt;</text>
  <text class="small muted" x="946" y="688">drop after 30 days (2nd job)</text>
</svg>
