<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
  <title id="title">App delivery gates</title>
  <desc id="desc">Nine gates from intake to operate, with a matrix of which gates each class (lab, internal, public) must pass, plus approval and exception rules.</desc>
  <defs><marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2f6fed"/></marker><marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1f9d8b"/></marker><marker id="a-ok" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2413b"/></marker><marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7c5cfc"/></marker><marker id="a-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/></marker><marker id="a-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7b8798"/></marker><style>
.bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.white{fill:#fff}
.small{font:14px sans-serif}.tiny{font:12.5px sans-serif}.body{font:16px sans-serif}.bold{font:700 16px sans-serif}
.head{font:700 21px sans-serif}.title{font:700 30px sans-serif}.pill{font:700 13px sans-serif;letter-spacing:.5px}
.card{stroke-width:2}.edge{fill:#eaf2ff;stroke:#2f6fed}.data{fill:#eafaf6;stroke:#1f9d8b}
.compute{fill:#f1edff;stroke:#7c5cfc}.host{fill:#fff;stroke:#b8c2d1}.note{fill:#fff7e8;stroke:#d97706}
.retired{fill:#fff1f1;stroke:#c2413b}.ops{fill:#ecfdf3;stroke:#16a34a}.ctrl{fill:#fdf2f8;stroke:#db2777}
.flow{fill:none;stroke:#2f6fed;stroke-width:3.5;marker-end:url(#a-blue)}
.dflow{fill:none;stroke:#1f9d8b;stroke-width:3.5;marker-end:url(#a-green)}
.gflow{fill:none;stroke:#16a34a;stroke-width:3.5;marker-end:url(#a-ok)}
.rflow{fill:none;stroke:#c2413b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a-red)}
.pflow{fill:none;stroke:#7c5cfc;stroke-width:3.5;marker-end:url(#a-purple)}
.kflow{fill:none;stroke:#db2777;stroke-width:3.5;marker-end:url(#a-pink)}
.dashed{fill:none;stroke:#7b8798;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a-muted)}
</style></defs>
  <rect class="bg" width="1400" height="730"/>
  <text class="title ink" x="50" y="58">App delivery gates</text>
  <text class="body muted" x="52" y="88">Standard 2026-10-31 • one gate path for every app in the lab</text>
  <rect class="host card" x="50" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="64" y="160" fill="#64748b">G0</text>
  <text class="head ink" x="64" y="190">Intake</text>
  <text class="tiny muted" x="64" y="214">owner</text>
  <text class="tiny muted" x="64" y="231">class</text>
  <text class="tiny muted" x="64" y="248">app.yml</text>
  <path class="flow" d="M186 190 H198"/>
  <rect class="compute card" x="198" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="212" y="160" fill="#7c5cfc">G1</text>
  <text class="head ink" x="212" y="190">Build</text>
  <text class="tiny muted" x="212" y="214">CI template</text>
  <text class="tiny muted" x="212" y="231">digest</text>
  <text class="tiny muted" x="212" y="248">scan</text>
  <path class="flow" d="M334 190 H346"/>
  <rect class="ctrl card" x="346" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="360" y="160" fill="#be185d">G2</text>
  <text class="head ink" x="360" y="190">Security</text>
  <text class="tiny muted" x="360" y="214">secrets</text>
  <text class="tiny muted" x="360" y="231">no ports</text>
  <text class="tiny muted" x="360" y="248">auth</text>
  <path class="flow" d="M482 190 H494"/>
  <rect class="data card" x="494" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="508" y="160" fill="#1f9d8b">G3</text>
  <text class="head ink" x="508" y="190">Runtime</text>
  <text class="tiny muted" x="508" y="214">stack</text>
  <text class="tiny muted" x="508" y="231">health</text>
  <text class="tiny muted" x="508" y="248">limits</text>
  <path class="flow" d="M630 190 H642"/>
  <rect class="data card" x="642" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="656" y="160" fill="#1f9d8b">G4</text>
  <text class="head ink" x="656" y="190">Data</text>
  <text class="tiny muted" x="656" y="214">provision</text>
  <text class="tiny muted" x="656" y="231">backup</text>
  <text class="tiny muted" x="656" y="248">restore</text>
  <path class="flow" d="M778 190 H790"/>
  <rect class="ops card" x="790" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="804" y="160" fill="#15803d">G5</text>
  <text class="head ink" x="804" y="190">Observe</text>
  <text class="tiny muted" x="804" y="214">probe</text>
  <text class="tiny muted" x="804" y="231">alerts → Mezon</text>
  <path class="flow" d="M926 190 H938"/>
  <rect class="edge card" x="938" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="952" y="160" fill="#2f6fed">G6</text>
  <text class="head ink" x="952" y="190">Release</text>
  <text class="tiny muted" x="952" y="214">staging</text>
  <text class="tiny muted" x="952" y="231">smoke</text>
  <text class="tiny muted" x="952" y="248">rollback</text>
  <path class="flow" d="M1074 190 H1086"/>
  <rect class="note card" x="1086" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="1100" y="160" fill="#b45309">G7</text>
  <text class="head ink" x="1100" y="190">Docs</text>
  <text class="tiny muted" x="1100" y="214">repo docs + vault doc</text>
  <path class="flow" d="M1222 190 H1234"/>
  <rect class="host card" x="1234" y="130" width="136" height="140" rx="14"/>
  <text class="pill" x="1248" y="160" fill="#64748b">G8</text>
  <text class="head ink" x="1248" y="190">Operate</text>
  <text class="tiny muted" x="1248" y="214">drift clean</text>
  <text class="tiny muted" x="1248" y="231">retire</text>
  <text class="pill" x="50" y="310" fill="#64748b">REQUIRED PER CLASS</text>
  <rect class="white card" stroke="#d8dee9" x="50" y="330" width="1300" height="58" rx="12"/>
  <text class="head" x="118.0" y="372" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="bold" x="266.0" y="372" text-anchor="middle" fill="#b45309">partial</text>
  <text class="bold" x="414.0" y="372" text-anchor="middle" fill="#b45309">partial</text>
  <text class="head" x="562.0" y="372" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="710.0" y="372" text-anchor="middle" fill="#94a3b8">—</text>
  <text class="bold" x="858.0" y="372" text-anchor="middle" fill="#b45309">partial</text>
  <text class="head" x="1006.0" y="372" text-anchor="middle" fill="#94a3b8">—</text>
  <text class="bold" x="1154.0" y="372" text-anchor="middle" fill="#b45309">partial</text>
  <text class="head" x="1302.0" y="372" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="pill" x="60" y="347" fill="#2f6fed">lab</text>
  <rect class="white card" stroke="#d8dee9" x="50" y="400" width="1300" height="58" rx="12"/>
  <text class="head" x="118.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="266.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="414.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="562.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="710.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="858.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1006.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1154.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1302.0" y="442" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="pill" x="60" y="417" fill="#2f6fed">internal</text>
  <rect class="white card" stroke="#d8dee9" x="50" y="470" width="1300" height="58" rx="12"/>
  <text class="head" x="118.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="266.0" y="512" text-anchor="middle" fill="#16a34a">✓+</text>
  <text class="head" x="414.0" y="512" text-anchor="middle" fill="#16a34a">✓+</text>
  <text class="head" x="562.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="710.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="858.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1006.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1154.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="head" x="1302.0" y="512" text-anchor="middle" fill="#16a34a">✓</text>
  <text class="pill" x="60" y="487" fill="#2f6fed">public</text>
  <text class="small muted" x="50" y="555">✓ required   partial = reduced form   — not required   ✓+ required with extra public controls</text>
  <rect class="white card" stroke="#d8dee9" x="50" y="585" width="640" height="110" rx="12"/>
  <text class="bold ink" x="66" y="611">Approvals</text>
  <text class="small muted" x="66" y="633">G0 / class change: owner merges the app.yml MR</text>
  <text class="small muted" x="66" y="653">staging: CI policy gate auto-merge · prod: owner merge + manual job</text>
  <text class="small muted" x="66" y="673">data migration / deprovision: explicit owner approval</text>
  <rect class="retired card" x="710" y="585" width="640" height="110" rx="12"/>
  <text class="bold ink" x="726" y="611">Exceptions</text>
  <text class="small muted" x="726" y="633">written in the vault project doc: gate · reason · control</text>
  <text class="small muted" x="726" y="653">expiry ≤ 90 days · expired exception blocks prod promotion</text>
  <text class="small muted" x="726" y="673">listed by the nightly drift report</text>
</svg>
