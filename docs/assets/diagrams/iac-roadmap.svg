<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap and recovery tiers</title>
  <desc id="desc">Left: recovery tiers T0 to T3 in rebuild order. Right: phases P0 to P8 on a week timeline.</desc>
  <defs><marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2f6fed"/></marker><marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1f9d8b"/></marker><marker id="a-ok" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2413b"/></marker><marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7c5cfc"/></marker><marker id="a-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/></marker><marker id="a-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7b8798"/></marker><style>
.bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.white{fill:#fff}
.small{font:14px sans-serif}.tiny{font:12.5px sans-serif}.body{font:16px sans-serif}.bold{font:700 16px sans-serif}
.head{font:700 21px sans-serif}.title{font:700 30px sans-serif}.pill{font:700 13px sans-serif;letter-spacing:.5px}
.card{stroke-width:2}.edge{fill:#eaf2ff;stroke:#2f6fed}.data{fill:#eafaf6;stroke:#1f9d8b}
.compute{fill:#f1edff;stroke:#7c5cfc}.host{fill:#fff;stroke:#b8c2d1}.note{fill:#fff7e8;stroke:#d97706}
.retired{fill:#fff1f1;stroke:#c2413b}.ops{fill:#ecfdf3;stroke:#16a34a}.ctrl{fill:#fdf2f8;stroke:#db2777}
.flow{fill:none;stroke:#2f6fed;stroke-width:3.5;marker-end:url(#a-blue)}
.dflow{fill:none;stroke:#1f9d8b;stroke-width:3.5;marker-end:url(#a-green)}
.gflow{fill:none;stroke:#16a34a;stroke-width:3.5;marker-end:url(#a-ok)}
.rflow{fill:none;stroke:#c2413b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a-red)}
.pflow{fill:none;stroke:#7c5cfc;stroke-width:3.5;marker-end:url(#a-purple)}
.kflow{fill:none;stroke:#db2777;stroke-width:3.5;marker-end:url(#a-pink)}
.dashed{fill:none;stroke:#7b8798;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a-muted)}
</style></defs>
  <rect class="bg" width="1400" height="790"/>
  <text class="title ink" x="50" y="58">Roadmap and recovery tiers</text>
  <text class="body muted" x="52" y="88">Plan 2026-10-31 • ~4–5 months part-time • each phase ends with evidence in the vault</text>
  <rect class="host card" x="50" y="120" width="420" height="640" rx="18"/>
  <text class="pill" x="72" y="152" fill="#64748b">RECOVERY TIERS</text>
  <text class="head ink" x="72" y="184">Rebuild order</text>
  <rect class="ctrl card" x="72" y="210" width="376" height="104" rx="12"/>
  <text class="bold ink" x="88" y="236">T0</text>
  <text class="small muted" x="88" y="258">Workstation · 1Password · repo mirror</text>
  <path class="flow" d="M260 314 V340"/>
  <rect class="data card" x="72" y="340" width="376" height="104" rx="12"/>
  <text class="bold ink" x="88" y="366">T1</text>
  <text class="small muted" x="88" y="388">MikroTik → Proxmox → Pi5</text>
  <text class="small muted" x="88" y="408">(data, edge, deploy runner, tofu state)</text>
  <path class="flow" d="M260 444 V470"/>
  <rect class="edge card" x="72" y="470" width="376" height="104" rx="12"/>
  <text class="bold ink" x="88" y="496">T2</text>
  <text class="small muted" x="88" y="518">VPS gateway (public edge, tunnels)</text>
  <path class="flow" d="M260 574 V600"/>
  <rect class="compute card" x="72" y="600" width="376" height="104" rx="12"/>
  <text class="bold ink" x="88" y="626">T3</text>
  <text class="small muted" x="88" y="648">VM100 / VM110 · GitLab · all Swarm apps</text>
  <text class="small muted" x="520" y="140">weeks (part-time)</text>
  <text class="tiny muted" x="520" y="170" text-anchor="middle">0</text>
  <path d="M520 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="602" y="170" text-anchor="middle">2</text>
  <path d="M602 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="684" y="170" text-anchor="middle">4</text>
  <path d="M684 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="766" y="170" text-anchor="middle">6</text>
  <path d="M766 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="848" y="170" text-anchor="middle">8</text>
  <path d="M848 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="930" y="170" text-anchor="middle">10</text>
  <path d="M930 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="1012" y="170" text-anchor="middle">12</text>
  <path d="M1012 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="1094" y="170" text-anchor="middle">14</text>
  <path d="M1094 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="1176" y="170" text-anchor="middle">16</text>
  <path d="M1176 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="1258" y="170" text-anchor="middle">18</text>
  <path d="M1258 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <text class="tiny muted" x="1340" y="170" text-anchor="middle">20</text>
  <path d="M1340 178 V760" stroke="#e2e8f0" stroke-width="1"/>
  <rect class="retired card" x="520" y="190" width="41" height="44" rx="10"/>
  <text class="bold ink" x="530" y="218">P0</text>
  <text class="small muted" x="573" y="218">Stabilise: DNS, backup owner, SSH identity, repo cleanup, mirror</text>
  <rect class="note card" x="561" y="252" width="82" height="44" rx="10"/>
  <text class="bold ink" x="571" y="280">P1</text>
  <text class="small muted" x="655" y="280">IaC base: layout, RustFS state, 1Password, CI plan, bin/hl, retire Semaphore</text>
  <rect class="compute card" x="643" y="314" width="82" height="44" rx="10"/>
  <text class="bold ink" x="653" y="342">P2</text>
  <text class="small muted" x="737" y="342">Host baseline: base/docker/swarm/pve_host</text>
  <rect class="edge card" x="725" y="376" width="82" height="44" rx="10"/>
  <text class="bold ink" x="735" y="404">P3</text>
  <text class="small muted" x="819" y="404">Edge + single route source + VPS gateway</text>
  <rect class="ctrl card" x="807" y="438" width="123" height="44" rx="10"/>
  <text class="bold ink" x="817" y="466">P4</text>
  <text class="small muted" x="942" y="466">Platform CI/CD: templates, runners, staging, golden path</text>
  <rect class="data card" x="930" y="500" width="164" height="44" rx="10"/>
  <text class="bold ink" x="940" y="528">P5</text>
  <text class="small muted" x="1106" y="528">Onboard apps + compose → Swarm</text>
  <rect class="ops card" x="930" y="562" width="82" height="44" rx="10"/>
  <text class="bold ink" x="940" y="590">P6</text>
  <text class="small muted" x="1024" y="590">Backup / DR + VM110 rebuild drill</text>
  <rect class="edge card" x="1094" y="624" width="82" height="44" rx="10"/>
  <text class="bold ink" x="1104" y="652">P7</text>
  <text class="small muted" x="1082" y="652" text-anchor="end">MikroTik · DNS · NetBird as code</text>
  <rect class="host card" x="1176" y="686" width="164" height="44" rx="10"/>
  <text class="bold ink" x="1186" y="714">P8</text>
  <text class="small muted" x="1164" y="714" text-anchor="end">Run: drift, Renovate, drills</text>
</svg>
