<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Golden path: onboard an app with one file</title>
  <desc id="desc">The central app.yml file generates the Swarm stack, routes, DNS, datastores, secrets, backup and monitoring. A CI policy gate blocks unsafe stacks.</desc>
  <defs><marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2f6fed"/></marker><marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#1f9d8b"/></marker><marker id="a-ok" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker><marker id="a-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2413b"/></marker><marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7c5cfc"/></marker><marker id="a-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#db2777"/></marker><marker id="a-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7b8798"/></marker><style>
.bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.white{fill:#fff}
.small{font:14px sans-serif}.tiny{font:12.5px sans-serif}.body{font:16px sans-serif}.bold{font:700 16px sans-serif}
.head{font:700 21px sans-serif}.title{font:700 30px sans-serif}.pill{font:700 13px sans-serif;letter-spacing:.5px}
.card{stroke-width:2}.edge{fill:#eaf2ff;stroke:#2f6fed}.data{fill:#eafaf6;stroke:#1f9d8b}
.compute{fill:#f1edff;stroke:#7c5cfc}.host{fill:#fff;stroke:#b8c2d1}.note{fill:#fff7e8;stroke:#d97706}
.retired{fill:#fff1f1;stroke:#c2413b}.ops{fill:#ecfdf3;stroke:#16a34a}.ctrl{fill:#fdf2f8;stroke:#db2777}
.flow{fill:none;stroke:#2f6fed;stroke-width:3.5;marker-end:url(#a-blue)}
.dflow{fill:none;stroke:#1f9d8b;stroke-width:3.5;marker-end:url(#a-green)}
.gflow{fill:none;stroke:#16a34a;stroke-width:3.5;marker-end:url(#a-ok)}
.rflow{fill:none;stroke:#c2413b;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a-red)}
.pflow{fill:none;stroke:#7c5cfc;stroke-width:3.5;marker-end:url(#a-purple)}
.kflow{fill:none;stroke:#db2777;stroke-width:3.5;marker-end:url(#a-pink)}
.dashed{fill:none;stroke:#7b8798;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#a-muted)}
</style></defs>
  <rect class="bg" width="1400" height="840"/>
  <text class="title ink" x="50" y="58">Golden path: onboard an app with one file</text>
  <text class="body muted" x="52" y="88">Plan 2026-10-31 • one MR with app.yml generates everything; nothing is created by hand</text>
  <rect class="note card" x="520" y="330" width="360" height="250" rx="12"/>
  <text class="bold ink" x="536" y="356">stacks/&lt;app&gt;/app.yml</text>
  <text class="small muted" x="536" y="378">name · repo · arch</text>
  <text class="small muted" x="536" y="402">host · port · resources</text>
  <text class="small muted" x="536" y="426">domain · exposure:</text>
  <text class="small muted" x="536" y="450">  public | lan | private</text>
  <text class="small muted" x="536" y="474">needs: postgres, redis, s3</text>
  <text class="small muted" x="536" y="498">backup · secrets · health</text>
  <rect class="data card" x="60" y="130" width="360" height="130" rx="12"/>
  <text class="bold ink" x="76" y="156">Swarm stack</text>
  <text class="small muted" x="76" y="178">networks from needs</text>
  <text class="small muted" x="76" y="198">limits · healthcheck</text>
  <text class="small muted" x="76" y="218">no host ports</text>
  <path class="flow" d="M520 455 C470 455 470 195 420 195"/>
  <rect class="edge card" x="60" y="330" width="360" height="130" rx="12"/>
  <text class="bold ink" x="76" y="356">Route + ingress</text>
  <text class="small muted" x="76" y="378">Pi5 Traefik router</text>
  <text class="small muted" x="76" y="398">VPS HostSNI if public</text>
  <text class="small muted" x="76" y="418">lan-only middleware</text>
  <path class="flow" d="M520 455 C470 455 470 395 420 395"/>
  <rect class="edge card" x="60" y="530" width="360" height="130" rx="12"/>
  <text class="bold ink" x="76" y="556">DNS</text>
  <text class="small muted" x="76" y="578">public: tofu dns → VPS</text>
  <text class="small muted" x="76" y="598">lan: AdGuard → 10.10.0.5</text>
  <text class="small muted" x="76" y="618">private: NetBird DNS</text>
  <path class="flow" d="M520 455 C470 455 470 595 420 595"/>
  <rect class="data card" x="980" y="130" width="360" height="130" rx="12"/>
  <text class="bold ink" x="996" y="156">Datastores</text>
  <text class="small muted" x="996" y="178">pg role+db (+ _stg)</text>
  <text class="small muted" x="996" y="198">Redis ACL user</text>
  <text class="small muted" x="996" y="218">RustFS bucket + key</text>
  <path class="flow" d="M880 455 C930 455 930 195 980 195"/>
  <rect class="ctrl card" x="980" y="330" width="360" height="130" rx="12"/>
  <text class="bold ink" x="996" y="356">Secrets</text>
  <text class="small muted" x="996" y="378">generated → 1Password</text>
  <text class="small muted" x="996" y="398">Swarm secret &lt;app&gt;_*_vN</text>
  <path class="flow" d="M880 455 C930 455 930 395 980 395"/>
  <rect class="ops card" x="980" y="530" width="360" height="130" rx="12"/>
  <text class="bold ink" x="996" y="556">Backup + monitoring</text>
  <text class="small muted" x="996" y="578">db-management / Databasus job</text>
  <text class="small muted" x="996" y="598">scrape target · alerts → Mezon</text>
  <path class="flow" d="M880 455 C930 455 930 595 980 595"/>
  <rect class="retired card" x="60" y="720" width="1280" height="90" rx="12"/>
  <text class="bold ink" x="76" y="746">Policy gate (CI) — blocks the MR when:</text>
  <text class="small muted" x="76" y="768">image without digest · no healthcheck · no limits · host port · network not in needs · secret not external · missing backup class · DB delete (only manual deprovision after final backup)</text>
</svg>
