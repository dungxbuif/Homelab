<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Upgrade and restore flow</title>
  <desc id="desc">Every approved service follows backup, update, smoke and rollback or restore stages. The 2026-10-31 ledger shows verified applied waves, Databasus partial scope, Cloudflared route blockage and GitLab operator deferral.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fed"/></marker>
    <style>
      .bg{fill:#f7f8fb}.ink{fill:#172033}.muted{fill:#64748b}.small{font:14px sans-serif}.body{font:16px sans-serif}.head{font:700 22px sans-serif}.title{font:700 30px sans-serif}.card{stroke:#d8dee9;stroke-width:2}.blue{fill:#eaf2ff;stroke:#2f6fed}.green{fill:#eafaf6;stroke:#1f9d8b}.amber{fill:#fff7e8;stroke:#d97706}.red{fill:#fff1f1;stroke:#c2413b}.white{fill:#fff;stroke:#d8dee9}.pill{font:700 13px sans-serif;letter-spacing:.5px}.flow{fill:none;stroke:#2f6fed;stroke-width:3;marker-end:url(#arrow)}.rule{stroke:#d8dee9;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1400" height="980"/>
  <text class="title ink" x="50" y="58">Controlled upgrade and restore flow</text>
  <text class="body muted" x="52" y="88">Per-service contract from the 2026-10-31 ledger • no data volume deletion • old digests and rollback sources retained</text>

  <rect class="blue card" x="50" y="120" width="300" height="72" rx="14"/><text class="head ink" x="78" y="165">1. Backup</text><text class="small muted" x="190" y="165">record image, source, data and checksum</text>
  <rect class="blue card" x="385" y="120" width="300" height="72" rx="14"/><text class="head ink" x="413" y="165">2. Update</text><text class="small muted" x="528" y="165">apply one service or compatible pair</text>
  <rect class="blue card" x="720" y="120" width="300" height="72" rx="14"/><text class="head ink" x="748" y="165">3. Smoke</text><text class="small muted" x="860" y="165">health, dependency and public checks</text>
  <rect class="blue card" x="1055" y="120" width="295" height="72" rx="14"/><text class="head ink" x="1083" y="165">4. Keep / restore</text><text class="small muted" x="1083" y="183">rollback before destructive recovery</text>
  <path class="flow" d="M350 156 L385 156"/><path class="flow" d="M685 156 L720 156"/><path class="flow" d="M1020 156 L1055 156"/>

  <text class="pill muted" x="50" y="230">LEDGER OUTCOME</text>
  <line class="rule" x1="50" y1="244" x2="1350" y2="244"/>

  <rect class="green card" x="50" y="265" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="300">Applied + verified</text>
  <text class="small ink" x="76" y="326">n8n / runners • NetBird server + dashboard</text>
  <text class="small muted" x="405" y="300">fresh data or volume backup; old digest retained</text>
  <text class="small muted" x="735" y="300">public/API/health checks passed</text>
  <text class="small" fill="#2f8f5b" x="1070" y="300">✓ keep candidate</text>
  <text class="small muted" x="1070" y="326">rollback source remains available</text>

  <rect class="green card" x="50" y="370" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="405">Applied + restore gate passed</text>
  <text class="small ink" x="76" y="431">RustFS • CouchDB • PostgreSQL/pgvector • Redis</text>
  <text class="small muted" x="405" y="405">object, logical dump or RDB/AOF backup</text>
  <text class="small muted" x="735" y="405">service smoke + isolated restore passed</text>
  <text class="small" fill="#2f8f5b" x="1070" y="405">✓ keep candidate</text>
  <text class="small muted" x="1070" y="431">pre-change backup remains readable</text>

  <rect class="green card" x="50" y="475" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="510">Applied after repair</text>
  <text class="small ink" x="76" y="536">CloudBeaver • PgBouncer • exporters • Ollama • Databasus</text>
  <text class="small muted" x="405" y="510">source/spec or volume archive retained</text>
  <text class="small muted" x="735" y="510">repair or retention fix, then health/API checks</text>
  <text class="small" fill="#2f8f5b" x="1070" y="510">✓ final candidate active</text>
  <text class="small muted" x="1070" y="536">Databasus: 6 approved DBs verified</text>

  <rect class="amber card" x="50" y="580" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="615">Partial / open scope</text>
  <text class="small ink" x="76" y="641">Databasus non-service jobs; recurring scheduler execution</text>
  <text class="small muted" x="405" y="615">accepted artifacts exist, but scope is intentionally bounded</text>
  <text class="small muted" x="735" y="615">repeat gate after provider or schedule changes</text>
  <text class="small" fill="#d97706" x="1070" y="615">○ operational follow-up</text>
  <text class="small muted" x="1070" y="641">do not infer full fleet acceptance</text>

  <rect class="red card" x="50" y="685" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="720">Applied binary, route blocked</text>
  <text class="small ink" x="76" y="746">Cloudflared native systemd • 2026.10.7</text>
  <text class="small muted" x="405" y="720">unit/package backup and rollback copy retained</text>
  <text class="small muted" x="735" y="720">Unauthorized: Tunnel not found; unit auto-restarts</text>
  <text class="small" fill="#c2413b" x="1070" y="720">○ owner/token repair required</text>
  <text class="small muted" x="1070" y="746">public route smoke not accepted</text>

  <rect class="red card" x="50" y="790" width="1300" height="88" rx="14"/>
  <text class="body ink" x="76" y="825">Skipped by operator</text>
  <text class="small ink" x="76" y="851">GitLab CE 18.11.11 unchanged</text>
  <text class="small muted" x="405" y="825">native backup grew to multi-GB; stopped safely before completion</text>
  <text class="small muted" x="735" y="825">no image update or acceptance smoke in this window</text>
  <text class="small" fill="#c2413b" x="1070" y="825">○ future maintenance window</text>
  <text class="small muted" x="1070" y="851">needs PostgreSQL 17 + feasible native backup/restore</text>

  <rect class="white card" x="50" y="910" width="1300" height="45" rx="12"/>
  <text class="small ink" x="75" y="938">Rollback rule: if smoke fails, restore the prior image first; for stateful services require maintenance state and a readable pre-upgrade backup. Never delete or recreate data volumes as the first response.</text>
</svg>
