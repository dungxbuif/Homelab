stages:
  - validate
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  EE_IMAGE: '$CI_REGISTRY_IMAGE/automation-ee'
  EE_TAG: '$CI_COMMIT_SHA'
  SEMAPHORE_RUNNER_IMAGE: '$CI_REGISTRY_IMAGE/semaphore-runner'
  DOCKER_TLS_CERTDIR: '/certs'
  DOCKER_HOST: 'tcp://docker:2376'
  DOCKER_DRIVER: overlay2

.docker-job:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  variables:
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
    DOCKER_TLS_VERIFY: '1'
    ANSIBLE_CONFIG: '$CI_PROJECT_DIR/automation/ansible/ansible.cfg'
  before_script:
    - docker info

validate:semaphore-bootstrap:
  extends: .docker-job
  stage: validate
  rules:
    - if: '$EXPERIMENTAL_EE_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --workdir /workspace node:24.0.2-alpine sh -c 'node --test automation/semaphore/tests/*.test.mjs'

validate:automation-ee:
  extends: .docker-job
  stage: validate
  rules:
    - if: '$EXPERIMENTAL_EE_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build --file automation/execution-environment/Containerfile --tag "$EE_IMAGE:$EE_TAG" automation/execution-environment
    - docker run --rm "$EE_IMAGE:$EE_TAG"
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'python -c "import pathlib, yaml; root=pathlib.Path(\"/workspace\"); files=[root/\".gitlab-ci.yml\"]+list((root/\"automation\").rglob(\"*.yml\"))+list((root/\"automation\").rglob(\"*.yaml\")); [list(yaml.safe_load_all(p.read_text())) for p in files]"'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'find /workspace/automation /workspace/backup -name "*.sh" -type f -print0 | xargs -0 -r shellcheck --severity=error'
    - docker run --rm --env ANSIBLE_CONFIG=/workspace/automation/ansible/ansible.cfg --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'ansible-lint /workspace/automation/ansible /workspace/automation/semaphore/playbooks'
    - docker run --rm --env ANSIBLE_CONFIG=/workspace/automation/ansible/ansible.cfg --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_inventory_resolution.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_runner_boundary.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_baseline_observation.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_backup_health_guard.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_backup_instance_deploy_contract.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_host_audit_guard.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_host_observer.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_homepage_release.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_deploy_contract.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_homepage_release_guard.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_homepage_release_enrollment.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_provisioner_release.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/ansible/tests/test_audit_artifact.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/semaphore/tests/test_control_network.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/semaphore/tests/test_runner_stack.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'python /workspace/automation/tests/test_policy_contract.py && python /workspace/automation/tests/test_route_contract.py'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'bash /workspace/automation/scripts/verify-routes.sh'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'ruby /workspace/automation/ansible/tests/test-inventory-contract.rb && ruby /workspace/automation/semaphore/tests/test-template-contract.rb'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'if find /workspace/automation/tofu -name "*.tf" -type f -print -quit 2>/dev/null | grep -q .; then tofu -chdir=/workspace/automation/tofu fmt -check -recursive; fi'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint sh "$EE_IMAGE:$EE_TAG" -c 'ruby /workspace/automation/scripts/validate-runtime-policy.rb --active /workspace/automation/policies/active-runtime.yaml --retired /workspace/automation/policies/retired-runtime.yaml'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_secret_scan.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_image_security.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_toolchain_security.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_provisioner_crossbuild.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_drift_evidence.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_private_artifact.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_family_network.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_release_notification.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_runtime_network_drift.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_runtime_evidence_collector.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tests/test_route_paths.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_rustfs_writer_identity.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" -m unittest discover -s /workspace/backup/tests -p 'test_provisioner*.py'
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_catalog_registration.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_health_reporting.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_retention_prerequisites.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_scheduler_generation.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_database_instances.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_instance_backup.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_instance_registration.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_instance_enrollment.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_restore_staging.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_verify_database_payload.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_rclone_workdir.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_restic_lifecycle.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_backup_client_release.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_upload_manifest.sh
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_restic_contract.sh
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_schedule_contract.sh
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/backup/tests/test_scheduler_contract.sh
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tofu/proxmox/tests/test_import_plan.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tofu/proxmox/tests/test_observed_baseline.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tofu/proxmox/tests/test_ca_trust.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tofu/proxmox/tests/test_encryption.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint python "$EE_IMAGE:$EE_TAG" /workspace/automation/tofu/proxmox/tests/test_module_validation.py
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/automation/scripts/validate-proxmox-module.sh
    - docker run --rm --volume "$CI_PROJECT_DIR:/workspace:ro" --entrypoint bash "$EE_IMAGE:$EE_TAG" /workspace/automation/scripts/check-secrets.sh /workspace

validate:experimental-ee:
  stage: validate
  image:
    name: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee@sha256:835cce544bde8fba8a381929d2e59dd8a95019c83c83f7ebb84e090cdd76c0a6
    entrypoint: [""]
  services:
    - name: docker:27.5.1-dind-rootless
      alias: docker
  variables:
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
    DOCKER_TLS_VERIFY: '1'
    ANSIBLE_CONFIG: '$CI_PROJECT_DIR/automation/ansible/ansible.cfg'
  before_script:
    - docker info
  rules:
    - if: '$EXPERIMENTAL_EE_ONLY == "true"'
    - when: never
  script:
    - test-toolchain --run
    - find automation backup -name '*.sh' -type f -print0 | xargs -0 -r shellcheck --severity=error
    - ansible-lint automation/ansible automation/semaphore/playbooks
    - python -m unittest discover -s automation/tests -p 'test_*.py'
    - python -m unittest discover -s automation/ansible/tests -p 'test_*.py'
    - python -m unittest discover -s automation/semaphore/tests -p 'test_*.py'
    - python -m unittest discover -s backup/tests -p 'test_*.py'
    - python -m unittest discover -s automation/tofu/proxmox/tests -p 'test_*.py'
    - ruby automation/ansible/tests/test-inventory-contract.rb
    - ruby automation/semaphore/tests/test-template-contract.rb
    - bash backup/tests/test_upload_manifest.sh
    - bash backup/tests/test_restic_contract.sh
    - bash automation/scripts/validate-proxmox-module.sh
    - bash automation/scripts/check-secrets.sh .

build:automation-ee:
  extends: .docker-job
  stage: build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - security-reports/
  needs:
    - validate:automation-ee
    - validate:semaphore-bootstrap
  rules:
    - if: '$EXPERIMENTAL_EE_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --file automation/execution-environment/Containerfile --tag "$EE_IMAGE:$EE_TAG" automation/execution-environment
    - sh automation/scripts/scan-image.sh "$EE_IMAGE:$EE_TAG" automation-ee
    - docker push "$EE_IMAGE:$EE_TAG"
    - docker image inspect "$EE_IMAGE:$EE_TAG" --format 'published={{index .RepoDigests 0}}'

build:semaphore-runner-candidate:
  extends: .docker-job
  stage: build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - security-reports/
  needs:
    - validate:automation-ee
    - validate:semaphore-bootstrap
  rules:
    - if: '$BUILD_SEMAPHORE_RUNNER_CANDIDATE == "true"'
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --build-arg AUTOMATION_EE_IMAGE="$EE_IMAGE:$EE_TAG" --file automation/semaphore/runner/Containerfile --tag "$SEMAPHORE_RUNNER_IMAGE:$EE_TAG" automation/semaphore/runner
    - sh automation/semaphore/tests/test-runner-image.sh "$SEMAPHORE_RUNNER_IMAGE:$EE_TAG"
    - sh automation/scripts/scan-image.sh "$SEMAPHORE_RUNNER_IMAGE:$EE_TAG" semaphore-runner
    - docker push "$SEMAPHORE_RUNNER_IMAGE:$EE_TAG"
    - docker image inspect "$SEMAPHORE_RUNNER_IMAGE:$EE_TAG" --format 'published={{index .RepoDigests 0}}'

build:provisioner:
  extends: .docker-job
  stage: build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - security-reports/
  needs:
    - validate:automation-ee
    - validate:semaphore-bootstrap
  rules:
    - if: '$EXPERIMENTAL_EE_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --platform linux/amd64 --file automation/provisioner/Dockerfile --tag "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-amd64" .
    - docker run --rm --entrypoint docker "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-amd64" --version
    - docker run --rm --entrypoint python "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-amd64" -c 'import sys; sys.path.insert(0, "/app/provisioner"); import server; assert server.ProvisioningBusyError; assert server.ProvisionerHandler.provision'
    - docker build --platform linux/arm64 --file automation/provisioner/Dockerfile --tag "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-arm64" .
    - sh automation/scripts/scan-image.sh "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-arm64" provisioner-arm64
    - docker push "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-arm64"
    - docker image inspect "$CI_REGISTRY_IMAGE/provisioner:$CI_COMMIT_SHA-arm64" --format 'published={{index .RepoDigests 0}}'
