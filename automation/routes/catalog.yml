---
schema_version: 1
catalog_name: homelab-edge-routes
tls:
  cert_resolver: letsencrypt
  wildcard_domain: '*.dungxbuif.com'
  root_domain: dungxbuif.com
entrypoints: [websecure]
middlewares:
  storage-cors:
    headers:
      accessControlAllowOriginList: ['*']
      accessControlAllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      accessControlAllowHeaders: ['*']
      accessControlMaxAge: 3600
      addVaryHeader: true
      customResponseHeaders:
        Access-Control-Allow-Private-Network: 'true'
  lan-only:
    ipAllowList:
      sourceRange: [10.10.0.0/24, 10.66.66.0/24, 10.0.0.0/24]
routes:
  - id: homepage
    hostnames: [dungxbuif.com, www.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.homepage:80
    health_path: /
    rollback_version: current
  - id: stirling-pdf
    hostnames: [stirling.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.stirling-pdf:8080
    health_path: /
    rollback_version: current
  - id: cdn
    hostnames: [cdn.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://rustfs:9001
    health_path: /
    rollback_version: current
  - id: storage
    hostnames: [storage.dungxbuif.com]
    exposure: public
    owner: platform
    middlewares: [storage-cors]
    backend:
      kind: service_dns
      url: http://rustfs:9000
    health_path: /
    rollback_version: current
  - id: registry
    hostnames: [registry.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://registry:5000
    health_path: /v2/
    rollback_version: current
  - id: speedtest
    hostnames: [speed.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://librespeed:80
    health_path: /
    rollback_version: current
  - id: pgadmin
    hostnames: [pgadmin.dungxbuif.com]
    exposure: lan
    owner: platform
    backend:
      kind: service_dns
      url: http://pgadmin:80
    health_path: /
    rollback_version: current
  - id: couchdb
    hostnames: [couchdb.dungxbuif.com, sync-db.dungxbuif.com]
    exposure: lan
    owner: platform
    backend:
      kind: service_dns
      url: http://couchdb:5984
    health_path: /
    rollback_version: current
  - id: llm
    hostnames: [llm.dungxbuif.com]
    exposure: public
    owner: mac-services
    backend:
      kind: tunnel
      url: http://103.82.21.202:18123
    health_path: /v1/models
    rollback_version: current
  - id: ocr
    hostnames: [ocr.dungxbuif.com]
    exposure: public
    owner: mac-services
    backend:
      kind: service_dns
      url: http://tasks.macocr-proxy:8080
    health_path: /health
    rollback_version: current
  - id: money
    hostnames: [money.dungxbuif.com]
    exposure: public
    owner: mypocket
    backend:
      kind: service_dns
      url: http://tasks.mypocket-api:8080
    health_path: /api/v1/health
    rollback_version: current
  - id: mezonhook
    hostnames: [mezonhook.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.mezonhook:8080
    health_path: /health
    rollback_version: current
  - id: family
    hostnames: [family.dungxbuif.com]
    exposure: public
    owner: family
    backend:
      kind: service_dns
      url: http://tasks.family-tree:3000
    health_path: /
    rollback_version: current
  - id: openclaw
    hostnames: [openclaw.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.openclaw:18789
    health_path: /
    rollback_version: current
  - id: n8n
    hostnames: [n8n.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.n8n:5678
    health_path: /healthz
    rollback_version: current
  - id: gitlab
    hostnames: [gitlab.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.gitlab_gitlab:80
    health_path: /users/sign_in
    rollback_version: current
  - id: gitlab-registry
    hostnames: [registry-gitlab.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.gitlab_gitlab:5005
    health_path: /v2/
    rollback_version: current
  - id: relayhub
    hostnames: [relayhub.dungxbuif.com]
    exposure: public
    owner: relayhub
    backend:
      kind: service_dns
      url: http://relayhub-api:8080
    health_path: /readyz
    rollback_version: current
  - id: netbird-grpc
    hostnames: [netbird.dungxbuif.com]
    rule: >-
      Host(`netbird.dungxbuif.com`) && (PathPrefix(`/signalexchange.SignalExchange/`)
      || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
    priority: 100
    exposure: public
    owner: netbird
    backend:
      kind: service_dns
      url: h2c://tasks.netbird-server:80
    health_path: /
    rollback_version: current
  - id: netbird-backend
    hostnames: [netbird.dungxbuif.com]
    rule: >-
      Host(`netbird.dungxbuif.com`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`)
      || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
    priority: 100
    exposure: public
    owner: netbird
    backend:
      kind: service_dns
      url: http://tasks.netbird-server:80
    health_path: /api
    rollback_version: current
  - id: netbird-dashboard
    hostnames: [netbird.dungxbuif.com]
    rule: Host(`netbird.dungxbuif.com`)
    priority: 1
    exposure: public
    owner: netbird
    backend:
      kind: service_dns
      url: http://tasks.netbird-dashboard:80
    health_path: /
    rollback_version: current
  - id: semaphore
    hostnames: [semaphore.dungxbuif.com]
    exposure: lan
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.semaphore_semaphore:3000
    health_path: /
    rollback_version: current
  - id: kubekosh
    hostnames: [kubekosh.dungxbuif.com]
    exposure: lan
    owner: platform
    backend:
      kind: service_dns
      url: http://kubekosh:80
    health_path: /
    rollback_version: current
  - id: k8s-syntax
    hostnames: [k8s-syntax.dungxbuif.com]
    exposure: public
    owner: platform
    backend:
      kind: service_dns
      url: http://tasks.k8s-syntax:80
    health_path: /
    rollback_version: current
