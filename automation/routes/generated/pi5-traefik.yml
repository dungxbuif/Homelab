http:
  middlewares:
    storage-cors:
      headers:
        accessControlAllowOriginList:
        - '*'
        accessControlAllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        accessControlAllowHeaders:
        - '*'
        accessControlMaxAge: 3600
        addVaryHeader: true
        customResponseHeaders:
          Access-Control-Allow-Private-Network: 'true'
    lan-only:
      ipAllowList:
        sourceRange:
        - 10.10.0.0/24
        - 10.66.66.0/24
        - 10.0.0.0/24
  routers:
    homepage:
      rule: Host(`dungxbuif.com`) || Host(`www.dungxbuif.com`)
      entryPoints:
      - websecure
      service: homepage
      tls: &id001
        certResolver: letsencrypt
        domains:
        - main: '*.dungxbuif.com'
          sans:
          - dungxbuif.com
    stirling-pdf:
      rule: Host(`stirling.dungxbuif.com`)
      entryPoints:
      - websecure
      service: stirling-pdf
      tls: *id001
    cdn:
      rule: Host(`cdn.dungxbuif.com`)
      entryPoints:
      - websecure
      service: cdn
      tls: *id001
    storage:
      rule: Host(`storage.dungxbuif.com`)
      entryPoints:
      - websecure
      service: storage
      tls: *id001
      middlewares:
      - storage-cors
    registry:
      rule: Host(`registry.dungxbuif.com`)
      entryPoints:
      - websecure
      service: registry
      tls: *id001
    speedtest:
      rule: Host(`speed.dungxbuif.com`)
      entryPoints:
      - websecure
      service: speedtest
      tls: *id001
    pgadmin:
      rule: Host(`pgadmin.dungxbuif.com`)
      entryPoints:
      - websecure
      service: pgadmin
      tls: *id001
      middlewares:
      - lan-only
    couchdb:
      rule: Host(`couchdb.dungxbuif.com`)
      entryPoints:
      - websecure
      service: couchdb
      tls: *id001
      middlewares:
      - lan-only
    sync-db:
      rule: Host(`sync-db.dungxbuif.com`) && (Path(`/`) || Path(`/_session`) || PathPrefix(`/obsidian_vault`))
      entryPoints:
      - websecure
      service: couchdb
      tls: *id001
      middlewares:
      - lan-only
      priority: 100
    llm:
      rule: Host(`llm.dungxbuif.com`)
      entryPoints:
      - websecure
      service: llm
      tls: *id001
    ocr:
      rule: Host(`ocr.dungxbuif.com`)
      entryPoints:
      - websecure
      service: ocr
      tls: *id001
    money:
      rule: Host(`money.dungxbuif.com`)
      entryPoints:
      - websecure
      service: money
      tls: *id001
    mezonhook:
      rule: Host(`mezonhook.dungxbuif.com`)
      entryPoints:
      - websecure
      service: mezonhook
      tls: *id001
    family:
      rule: Host(`family.dungxbuif.com`)
      entryPoints:
      - websecure
      service: family
      tls: *id001
    whiteboard:
      rule: Host(`whiteboard.dungxbuif.com`)
      entryPoints:
      - websecure
      service: whiteboard
      tls: *id001
    openclaw:
      rule: Host(`openclaw.dungxbuif.com`)
      entryPoints:
      - websecure
      service: openclaw
      tls: *id001
    n8n:
      rule: Host(`n8n.dungxbuif.com`)
      entryPoints:
      - websecure
      service: n8n
      tls: *id001
    gitlab:
      rule: Host(`gitlab.dungxbuif.com`)
      entryPoints:
      - websecure
      service: gitlab
      tls: *id001
    gitlab-registry:
      rule: Host(`registry-gitlab.dungxbuif.com`)
      entryPoints:
      - websecure
      service: gitlab-registry
      tls: *id001
    relayhub:
      rule: Host(`relayhub.dungxbuif.com`)
      entryPoints:
      - websecure
      service: relayhub
      tls: *id001
    netbird-grpc:
      rule: Host(`netbird.dungxbuif.com`) && (PathPrefix(`/signalexchange.SignalExchange/`)
        || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      entryPoints:
      - websecure
      service: netbird-server-h2c
      tls: *id001
      priority: 100
    netbird-backend:
      rule: Host(`netbird.dungxbuif.com`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`)
        || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      entryPoints:
      - websecure
      service: netbird-server
      tls: *id001
      priority: 100
    netbird-dashboard:
      rule: Host(`netbird.dungxbuif.com`)
      entryPoints:
      - websecure
      service: netbird-dashboard
      tls: *id001
      priority: 1
    semaphore:
      rule: Host(`semaphore.dungxbuif.com`)
      entryPoints:
      - websecure
      service: semaphore
      tls: *id001
      middlewares:
      - lan-only
    kubekosh:
      rule: Host(`kubekosh.dungxbuif.com`)
      entryPoints:
      - websecure
      service: kubekosh
      tls: *id001
      middlewares:
      - lan-only
    k8s-syntax:
      rule: Host(`k8s-syntax.dungxbuif.com`)
      entryPoints:
      - websecure
      service: k8s-syntax
      tls: *id001
  services:
    homepage:
      loadBalancer:
        servers:
        - url: http://tasks.homepage:80
        passHostHeader: true
    stirling-pdf:
      loadBalancer:
        servers:
        - url: http://tasks.stirling-pdf:8080
        passHostHeader: true
    cdn:
      loadBalancer:
        servers:
        - url: http://rustfs:9001
    storage:
      loadBalancer:
        servers:
        - url: http://rustfs:9000
    registry:
      loadBalancer:
        servers:
        - url: http://registry:5000
    speedtest:
      loadBalancer:
        servers:
        - url: http://librespeed:80
    pgadmin:
      loadBalancer:
        servers:
        - url: http://pgadmin:80
    couchdb:
      loadBalancer:
        servers:
        - url: http://couchdb:5984
    llm:
      loadBalancer:
        servers:
        - url: http://103.82.21.202:18123
    ocr:
      loadBalancer:
        servers:
        - url: http://tasks.macocr-proxy:8080
        passHostHeader: true
    money:
      loadBalancer:
        servers:
        - url: http://tasks.mypocket-api:8080
        passHostHeader: true
    mezonhook:
      loadBalancer:
        servers:
        - url: http://tasks.mezonhook:8080
        passHostHeader: true
    family:
