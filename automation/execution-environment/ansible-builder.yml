---
version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: '--pre'

dependencies:
  python: requirements.txt
  galaxy: requirements.yml

additional_build_steps:
  append:
    - COPY tests/test-toolchain.sh /usr/local/bin/test-toolchain
    - RUN chmod 0755 /usr/local/bin/test-toolchain
