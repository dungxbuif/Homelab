services:
  diun:
    image: crazymax/diun@sha256:e324b793eb32dfb7f74d3a39421ebf090141caaadee69b8f78da63112408ee25
    container_name: homelab-diun
    command: ["serve", "--config", "/diun.yml"]
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      LOG_LEVEL: info
      LOG_JSON: "false"
      DIUN_PROVIDERS_DOCKER: "true"
    volumes:
      - ./data:/data
      - ./diun.yml:/diun.yml:ro
      - ./notify-mezon.sh:/usr/local/bin/diun-mezon-notify.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/homelab-backup/secrets/mezon-webhook:/run/secrets/mezon-webhook:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
