---
- name: Ensure the unprivileged automation group exists
  ansible.builtin.group:
    name: '{{ automation_user }}'
    state: present

- name: Ensure the unprivileged automation user exists
  ansible.builtin.user:
    name: '{{ automation_user }}'
    group: '{{ automation_user }}'
    shell: '{{ automation_user_shell }}'
    create_home: true
    password_lock: true
    state: present
  when: automation_create_user | bool
