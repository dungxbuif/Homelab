---
- name: Read journald disk usage
  ansible.builtin.command:
    argv:
      - /usr/bin/journalctl
      - --disk-usage
  register: journal_usage
  changed_when: false
  check_mode: false

- name: Report logging baseline result
  ansible.builtin.debug:
    msg:
      host: '{{ inventory_hostname }}'
      journal_usage: '{{ journal_usage.stdout | default("") }}'
