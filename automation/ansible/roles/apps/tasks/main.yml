---
- name: Verify the application catalog exists on the runner
  ansible.builtin.stat:
    path: '{{ playbook_dir }}/../../stacks/catalog.yml'
  register: app_catalog
  delegate_to: localhost
  changed_when: false

- name: Require an application catalog for app operations
  ansible.builtin.assert:
    that:
      - app_catalog.stat.exists
    fail_msg: Application operations require automation/stacks/catalog.yml.
