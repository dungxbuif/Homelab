---
- name: Move idle Semaphore UI to private control network
  hosts: pi5
  gather_facts: false
  become: false
  tasks:
    - name: Require explicit idle UI migration approval
      ansible.builtin.assert:
        that:
          - semaphore_ui_network_approved | default(false) | bool
          - semaphore_tasks_idle_verified | default(false) | bool

    - name: Read target network identity
      ansible.builtin.command:
        argv: [docker, network, inspect, homelab-control-net, --format, '{{ "{{.Id}}" }}']
      register: control_network_id
      changed_when: false

    - name: Read existing UI network identities
      ansible.builtin.command:
        argv: [docker, service, inspect, semaphore_semaphore, --format, '{{ "{{json .Spec.TaskTemplate.Networks}}" }}']
      register: ui_networks
      changed_when: false

    - name: Migrate with rollback on failed ingress
      when: control_network_id.stdout not in (ui_networks.stdout | from_json | map(attribute='Target') | list)
      block:
        - name: Change only UI networks DNS and safe rollout order
          ansible.builtin.command:
            argv:
              - docker
              - service
              - update
              - '--network-add'
              - homelab-control-net
              - '--network-rm'
              - homelab-net
              - '--dns-add'
              - 10.10.0.5
              - '--update-order'
              - stop-first
              - '--detach=false'
              - semaphore_semaphore
          changed_when: true

        - name: Verify TLS UI login endpoint after rollout
          ansible.builtin.command:
            argv:
              - curl
              - '--fail'
              - '--silent'
              - '--show-error'
              - '--max-time'
              - '10'
              - '--resolve'
              - 'semaphore.dungxbuif.com:443:10.10.0.5'
              - '--output'
              - /dev/null
              - '--write-out'
              - '%{http_code}'
              - https://semaphore.dungxbuif.com/auth/login
          register: ui_probe
          changed_when: false
          retries: 10
          delay: 3
          until: ui_probe.rc == 0 and ui_probe.stdout == '200'
      rescue:
        - name: Restore previous UI service spec
          ansible.builtin.command:
            argv: [docker, service, rollback, '--detach=false', semaphore_semaphore]
          changed_when: true
        - name: Stop after rollback
          ansible.builtin.fail:
            msg: UI network migration failed; previous service spec restored.
