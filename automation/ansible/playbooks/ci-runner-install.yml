---
- name: Install project runner inside the CI rootless daemon
  hosts: all
  become: true
  gather_facts: true
  vars:
    ci_user: homelab-ci
    ci_home: /home/homelab-ci
    runner_image: gitlab/gitlab-runner@sha256:816e7c594a8c319856a710283ed7fba7a9f633cbfe6b167b0632ea3dec101fee
  tasks:
    - name: Require explicit enrollment on VM100
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'vm100-prod'
          - ci_bootstrap_approved | default(false) | bool

    - name: Resolve the CI identity
      ansible.builtin.getent:
        database: passwd
        key: '{{ ci_user }}'

    - name: Create private runner configuration directory
      ansible.builtin.file:
        path: '{{ ci_home }}/runner'
        state: directory
        owner: '{{ ci_user }}'
        group: '{{ ci_user }}'
        mode: '0700'

    - name: Install project-scoped runner configuration
      ansible.builtin.template:
        src: '{{ playbook_dir }}/../templates/ci-runner-config.toml.j2'
        dest: '{{ ci_home }}/runner/config.toml'
        owner: '{{ ci_user }}'
        group: '{{ ci_user }}'
        mode: '0600'
      vars:
        runner_credential: '{{ lookup("file", runner_credential_path) | from_json }}'
      no_log: true

    - name: Start runner using only the rootless socket
      become: true
      become_user: '{{ ci_user }}'
      community.docker.docker_container:
        name: homelab-gitlab-runner
        image: '{{ runner_image }}'
        docker_host: 'unix:///run/user/{{ ansible_facts.getent_passwd[ci_user][1] }}/docker.sock'
        state: started
        restart_policy: unless-stopped
        memory: 256M
        cpus: 0.5
        volumes:
          - '{{ ci_home }}/runner:/etc/gitlab-runner'
          - '/run/user/{{ ansible_facts.getent_passwd[ci_user][1] }}/docker.sock:/var/run/docker.sock'
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: '3'
