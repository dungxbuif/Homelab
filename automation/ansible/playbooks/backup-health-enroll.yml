---
- name: Enroll restricted backup health identity on VM100
  hosts: vm100
  gather_facts: false
  vars:
    ansible_become: true
  tasks:
    - name: Require approved enrollment and one public key
      ansible.builtin.assert:
        that:
          - backup_health_enrollment_approved | default(false) | bool
          - >-
            backup_health_public_key is match('^ssh-ed25519 [A-Za-z0-9+/=]+(?: [^\r\n]*)?$')

    - name: Create restricted service identity without supplementary groups
      ansible.builtin.user:
        name: homelab-audit
        system: true
        create_home: true
        shell: /bin/sh
        password_lock: true
        groups: ''

    - name: Create root-owned helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install root-owned command guard
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/backup-health-ssh-guard.sh'
        dest: /usr/local/libexec/homelab-backup-health-guard
        owner: root
        group: root
        mode: '0755'

    - name: Install root-owned health-only helper
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/backup-health-helper.sh'
        dest: /usr/local/libexec/homelab-backup-health
        owner: root
        group: root
        mode: '0755'

    - name: Allow only the exact helper without arguments as backup owner
      ansible.builtin.copy:
        dest: /etc/sudoers.d/homelab-backup-health
        content: 'homelab-audit ALL=(ubuntu) NOPASSWD: /usr/local/libexec/homelab-backup-health ""'
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Create root-managed SSH trust directory
      ansible.builtin.file:
        path: /home/homelab-audit/.ssh
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Prevent identity from replacing its SSH trust directory
      ansible.builtin.file:
        path: /home/homelab-audit
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install one forced-command public key
      ansible.builtin.copy:
        dest: /home/homelab-audit/.ssh/authorized_keys
        owner: root
        group: root
        mode: '0644'
        content: >-
          restrict,command="/usr/local/libexec/homelab-backup-health-guard" {{ backup_health_public_key }}
