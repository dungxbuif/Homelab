---
- name: Repair GitLab registry split-DNS ingress
  hosts: all
  gather_facts: false
  vars:
    edge_config: /home/dungxbuif/edge/traefik/dynamic.yml
  tasks:
    - name: Require explicit route publication approval
      ansible.builtin.assert:
        that:
          - registry_route_approved | default(false) | bool
          - inventory_hostname == '10.10.0.5'

    - name: Read existing edge config
      ansible.builtin.slurp:
        src: '{{ edge_config }}'
      register: edge_source
      no_log: true

    - name: Parse configuration without exposing private middleware
      ansible.builtin.set_fact:
        edge_document: '{{ edge_source.content | b64decode | from_yaml }}'
      no_log: true

    - name: Allocate a rollback file for this run
      ansible.builtin.tempfile:
        state: file
        path: /home/dungxbuif/edge/traefik
        prefix: dynamic.pre-registry.
      register: registry_backup
      when: not ansible_check_mode

    - name: Preserve pre-change bytes
      ansible.builtin.copy:
        content: '{{ edge_source.content | b64decode }}'
        dest: '{{ registry_backup.path }}'
        mode: '0600'
      no_log: true
      when: not ansible_check_mode

    - name: Stage the narrow registry addition
      ansible.builtin.copy:
        content: '{{ edge_document | combine(registry_addition, recursive=true) | to_nice_yaml }}'
        dest: '{{ edge_config }}.registry-staged'
        mode: '0600'
      vars:
        registry_addition:
          http:
            routers:
              gitlab-registry:
                rule: Host(`registry-gitlab.dungxbuif.com`)
                entryPoints: [websecure]
                service: gitlab-registry
                tls: '{{ edge_document.http.routers.gitlab.tls }}'
            services:
              gitlab-registry:
                loadBalancer:
                  passHostHeader: true
                  servers:
                    - url: http://tasks.gitlab_gitlab:5005
      no_log: true

    - name: Publish and verify without restarting the edge
      when: not ansible_check_mode
      block:
        - name: Publish into the existing mounted inode
          ansible.builtin.script:
            cmd: '{{ playbook_dir | dirname | dirname }}/scripts/publish-traefik-file.py --source {{ edge_config }}.registry-staged --target {{ edge_config }}'
            executable: python3
          register: registry_publish
          changed_when: registry_publish.stdout | trim == 'changed'

        - name: Verify registry HTTPS challenge from LAN
          ansible.builtin.uri:
            url: https://registry-gitlab.dungxbuif.com/v2/
            status_code: 401
            validate_certs: true
          register: registry_probe
          retries: 6
          delay: 3
          until: registry_probe.status == 401 and registry_probe.docker_distribution_api_version | default('') == 'registry/2.0'
      rescue:
        - name: Restore pre-change routing in place
          ansible.builtin.script:
            cmd: '{{ playbook_dir | dirname | dirname }}/scripts/publish-traefik-file.py --source {{ registry_backup.path }} --target {{ edge_config }}'
            executable: python3
          changed_when: true
        - name: Fail the route job after rollback
          ansible.builtin.fail:
            msg: Registry LAN verification failed; original routing restored.
