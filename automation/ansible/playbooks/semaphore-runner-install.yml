---
- name: Deploy the inactive Semaphore runner through the Swarm manager
  hosts: all
  gather_facts: false
  become: false
  vars:
    semaphore_credential: '{{ lookup("file", semaphore_credential_path) | from_json }}'
    registry_credential: '{{ lookup("file", registry_credential_path) | from_json }}'
    semaphore_runner_config:
      tmp_path: /tmp/semaphore
      web_host: https://semaphore.dungxbuif.com
      runner:
        token: '{{ semaphore_credential.token }}'
    semaphore_runner_secret: 'semaphore_runner_{{ (semaphore_runner_config | to_json | hash("sha256"))[:16] }}'
  tasks:
    - name: Require approved manager and verified immutable runner image
      ansible.builtin.assert:
        that:
          - semaphore_runner_bootstrap_approved | default(false) | bool
          - ansible_host | default(inventory_hostname) == '10.10.0.5'
          - >-
            semaphore_runner_image is match('^registry-gitlab[.]dungxbuif[.]com/dungxbuif/homelab-automation/semaphore-runner@sha256:[a-f0-9]{64}$')

    - name: Verify manager availability
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - '{{ "{{.Swarm.ControlAvailable}}" }}'
      changed_when: false
      register: manager_status
      failed_when: manager_status.stdout != 'true'

    - name: List immutable runner configuration secrets
      ansible.builtin.command:
        argv: [docker, secret, ls, --format, '{{ "{{.Name}}" }}']
      register: secret_status
      changed_when: false
      no_log: true

    - name: Require existing provisioner credential without reading it
      ansible.builtin.assert:
        that:
          - "'homelab_provisioner_token' in secret_status.stdout_lines"
        fail_msg: Existing provisioner secret is required before deploying the runner.
      no_log: true

    - name: Create immutable runner configuration secret
      ansible.builtin.command:
        argv: [docker, secret, create, '{{ semaphore_runner_secret }}', '-']
        stdin: '{{ semaphore_runner_config | to_json }}'
      changed_when: true
      when: semaphore_runner_secret not in secret_status.stdout_lines
      no_log: true

    - name: Create private deployment scratch directory
      ansible.builtin.tempfile:
        state: directory
        prefix: semaphore-runner-deploy-
      register: deployment_directory

    - name: Deploy with temporary registry credentials
      block:
        - name: Write scoped registry authentication
          ansible.builtin.copy:
            dest: '{{ deployment_directory.path }}/config.json'
            mode: '0600'
            content: >-
              {{ {'auths': {'registry-gitlab.dungxbuif.com':
              {'auth': (registry_credential.username ~ ':' ~ registry_credential.token) | b64encode}}} | to_json }}
          no_log: true

        - name: Render pinned runner stack
          ansible.builtin.template:
            src: '{{ playbook_dir | dirname }}/templates/semaphore-runner-stack.yml.j2'
            dest: '{{ deployment_directory.path }}/stack.yml'
            mode: '0600'

        - name: Reconcile only the Semaphore runner stack
          ansible.builtin.command:
            argv:
              - docker
              - --config
              - '{{ deployment_directory.path }}'
              - stack
              - deploy
              - --with-registry-auth
              - --resolve-image
              - always
              - -c
              - '{{ deployment_directory.path }}/stack.yml'
              - semaphore-executor
          changed_when: true

        - name: Wait for the runner replica on VM100
          ansible.builtin.command:
            argv:
              - docker
              - service
              - ls
              - --filter
              - name=semaphore-executor_runner
              - --format
              - '{{ "{{.Replicas}}" }}'
          register: replica_status
          changed_when: false
          until: replica_status.stdout == '1/1'
          retries: 30
          delay: 5
      always:
        - name: Remove temporary registry credentials and manifest
          ansible.builtin.file:
            path: '{{ deployment_directory.path }}'
            state: absent
