---
- name: Enroll a local PostgreSQL instance without interrupting backup jobs
  hosts: pi5
  gather_facts: false
  become: false
  vars:
    backup_live_root: /ssd-data/infra/backup-runner/app/backup
    backup_candidate_root: /ssd-data/infra/backup-runner/candidates
    backup_new_modules:
      - run-database-backup.py
      - common.py
      - register_resource.py
      - validate_inventory.py
    backup_preserved_modules:
      - backup-postgres.py
      - backup-couchdb.py
      - validate_provision_request.py
  tasks:
    - name: Require explicit enrollment and fixed host identity
      ansible.builtin.assert:
        that:
          - backup_instance_enrollment_approved | default(false) | bool
          - inventory_hostname == 'pi5'
          - ansible_host == '10.10.0.5'
          - ansible_user == 'dungxbuif'
          - backup_instance is mapping

    - name: Verify backup account identity
      ansible.builtin.command: id -u
      register: backup_instance_uid
      changed_when: false
      check_mode: false
      failed_when: backup_instance_uid.stdout != '1004'

    - name: Prepare candidate parent
      ansible.builtin.file:
        path: '{{ backup_candidate_root }}'
        state: directory
        mode: '0700'
      when: not ansible_check_mode

    - name: Stage and activate reviewed backup generation
      when: not ansible_check_mode
      block:
        - name: Allocate private candidate generation
          ansible.builtin.tempfile:
            state: directory
            path: '{{ backup_candidate_root }}'
            prefix: postgres-instances-
          register: backup_candidate

        - name: Install reviewed modules in candidate
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../../../backup/scripts/{{ item }}'
            dest: '{{ backup_candidate.path }}/{{ item }}'
            mode: '0444'
          loop: '{{ backup_new_modules }}'

        - name: Preserve installed native adapter behavior
          ansible.builtin.copy:
            src: '{{ backup_live_root }}/scripts/{{ item }}'
            dest: '{{ backup_candidate.path }}/{{ item }}'
            remote_src: true
            mode: '0444'
          loop: '{{ backup_preserved_modules }}'

        - name: Validate candidate catalog without changing production
          ansible.builtin.command:
            argv:
              - python3
              - '-c'
              - |
                import json, sys
                from pathlib import Path
                sys.path.insert(0, sys.argv[1])
                from common import load_document, write_json
                from register_resource import register_instance_file
                from validate_inventory import validate
                root = Path(sys.argv[2])
                candidate = Path(sys.argv[1]) / 'inventory-check.json'
                write_json(candidate, load_document(root / 'inventory.yaml'))
                register_instance_file(candidate, json.loads(sys.argv[3]))
                errors = validate(load_document(candidate), load_document(root / 'policies.yaml'))
                if errors:
                    raise SystemExit('; '.join(errors))
                print('candidate inventory valid')
              - '{{ backup_candidate.path }}'
              - '{{ backup_live_root }}'
              - '{{ backup_instance | to_json }}'
          changed_when: false
          no_log: true

        - name: Activate and enroll only while holding the real backup lock
          ansible.builtin.command:
            argv:
              - flock
              - '-n'
              - '-E'
              - '75'
              - /ssd-data/infra/backups/homelab/.homelab-backup.lock
              - python3
              - '-c'
              - |
                import json, os, shutil, sys
                from pathlib import Path
                generation = Path(sys.argv[1])
                root = Path(sys.argv[2])
                sys.path.insert(0, str(generation))
                from common import write_json
                from register_resource import register_instance_file
                catalog_lock = root / '.inventory.yaml.lock'
                catalog_lock.touch(mode=0o600, exist_ok=True)
                with catalog_lock.open('r+'):
                    pass
                def sync_directory(path):
                    fd = os.open(path, os.O_RDONLY | os.O_DIRECTORY)
                    try:
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                previous = {}
                for name in ('validate_inventory.py', 'run-database-backup.py'):
                    target = root / 'scripts' / name
                    previous[name] = os.readlink(target) if target.is_symlink() else None
                    shutil.copy2(target, generation / ('previous-' + name))
                write_json(generation / 'rollback.json', previous)
                for staged in generation.iterdir():
                    if staged.is_file():
                        with staged.open('rb') as handle:
                            os.fsync(handle.fileno())
                sync_directory(generation)
                sync_directory(generation.parent)
                sync_directory(generation.parent.parent)
                for name in previous:
                    target = root / 'scripts' / name
                    temporary = generation / ('activate-' + name)
                    temporary.symlink_to(generation / name)
                    os.replace(temporary, target)
                sync_directory(root / 'scripts')
                report = register_instance_file(root / 'inventory.yaml', json.loads(sys.argv[3]))
                sync_directory(root)
                print(json.dumps({'generation': str(generation), 'catalog': report}))
              - '{{ backup_candidate.path }}'
              - '{{ backup_live_root }}'
              - '{{ backup_instance | to_json }}'
          register: backup_enrollment
          changed_when: backup_enrollment.rc == 0
          failed_when: false
          no_log: true

        - name: Require successful activation without revealing request data
          ansible.builtin.assert:
            that: backup_enrollment.rc == 0
            fail_msg: >-
              {{ 'Backup lock is busy; candidate staged but not activated.'
                 if backup_enrollment.rc == 75 else
                 'Enrollment failed; inspect preserved candidate and rollback metadata.' }}

        - name: Report installed generation and catalog outcome
          ansible.builtin.debug:
            var: backup_enrollment.stdout
