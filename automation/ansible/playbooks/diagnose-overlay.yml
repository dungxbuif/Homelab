---
- name: Read encrypted overlay diagnostics without exposing key material
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Require the Pi5 bootstrap target
      ansible.builtin.assert:
        that:
          - ansible_host | default(inventory_hostname) == '10.10.0.5'

    - name: Read IPsec policies using the existing login credential
      ansible.builtin.command:
        argv: [sudo, '-S', '-p', '', ip, xfrm, policy]
        stdin: '{{ ansible_password }}'
      register: policies
      changed_when: false
      no_log: true

    - name: Report policies without IPsec state keys
      ansible.builtin.debug:
        var: policies.stdout_lines

    - name: Read security association metadata with key material suppressed
      ansible.builtin.command:
        argv: [sudo, '-S', '-p', '', ip, '-s', xfrm, state, list, nokeys]
        stdin: '{{ ansible_password }}'
      register: associations
      changed_when: false
      no_log: true

    - name: Report association metadata without keys
      ansible.builtin.debug:
        var: associations.stdout_lines

    - name: Read kernel release
      ansible.builtin.command: uname -r
      register: kernel_release
      changed_when: false

    - name: Report kernel release
      ansible.builtin.debug:
        var: kernel_release.stdout
