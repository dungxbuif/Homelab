---
- name: Repair private provisioner failure handling
  hosts: pi5
  gather_facts: false
  become: false
  vars:
    provisioner_module: /ssd-data/infra/backup-runner/app/backup/scripts/provisioner.py
  tasks:
    - name: Require explicit repair approval and idle tasks
      ansible.builtin.assert:
        that:
          - provisioner_safety_repair_approved | default(false) | bool
          - semaphore_tasks_idle_verified | default(false) | bool
          - ansible_user == 'dungxbuif'

    - name: Read live module checksum
      ansible.builtin.stat:
        path: '{{ provisioner_module }}'
        checksum_algorithm: sha256
      register: provisioner_before

    - name: Refuse an unreviewed live module
      ansible.builtin.assert:
        that:
          - >-
            provisioner_before.stat.checksum in
            ['9249a252fb5f3bf109cdf051877fab499a0c06a4d85a98790498eefce39b8a95',
            lookup('file', playbook_dir ~ '/../../../backup/scripts/provisioner.py', rstrip=false) | hash('sha256')]

    - name: Install reviewed module with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../backup/scripts/provisioner.py'
        dest: '{{ provisioner_module }}'
        mode: '0644'
        backup: true
      notify: Reload provisioner imports

    - name: Reload service before health verification
      ansible.builtin.meta: flush_handlers

    - name: Locate running provisioner container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - '--filter'
          - label=com.docker.swarm.service.name=homelab-provisioner_provisioner
          - '--format'
          - '{{ "{{.ID}}" }}'
      register: provisioner_container
      changed_when: false
      failed_when: provisioner_container.stdout_lines | length != 1

    - name: Verify loaded private HTTP service
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - '{{ provisioner_container.stdout }}'
          - python3
          - '-c'
          - >-
            import json, urllib.request;
            assert json.load(urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5))['status'] == 'ok'
      changed_when: false
  handlers:
    - name: Reload provisioner imports
      ansible.builtin.command:
        argv: [docker, service, update, '--force', '--detach=false', homelab-provisioner_provisioner]
      changed_when: true
