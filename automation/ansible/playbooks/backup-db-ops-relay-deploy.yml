---
- name: Deploy the private VM110 database operations relay on VM100
  hosts: vm100_worker
  gather_facts: false
  serial: 1
  vars:
    relay_deploy_approved: false
    relay_root: /opt/apps/homelab-backup-db-ops-relay
  pre_tasks:
    - name: Require explicit relay deployment approval
      ansible.builtin.assert:
        that: relay_deploy_approved | bool
        fail_msg: Refusing to deploy the private DB operations relay without relay_deploy_approved=true.
  tasks:
    - name: Create the relay directory
      ansible.builtin.file:
        path: '{{ relay_root }}'
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0750'
      become: true

    - name: Install the relay Compose definition
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../automation/backup-runner/db-ops-relay.compose.yml'
        dest: '{{ relay_root }}/compose.yml'
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Install the PostgreSQL relay Nginx stream configuration
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../automation/backup-runner/postgres-nginx.conf'
        dest: '{{ relay_root }}/postgres-nginx.conf'
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Install the CouchDB relay Nginx stream configuration
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../automation/backup-runner/couch-nginx.conf'
        dest: '{{ relay_root }}/couch-nginx.conf'
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Validate and start the private relay
      ansible.builtin.command:
        cmd: /usr/bin/sudo -n /usr/bin/docker compose -f {{ relay_root }}/compose.yml up -d --force-recreate --remove-orphans
      become: false
      changed_when: true

    - name: Verify the PostgreSQL relay is running
      ansible.builtin.command:
        cmd: /usr/bin/sudo -n /usr/bin/docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' homelab-backup-db-ops-postgres-relay
      become: false
      register: relay_running
      changed_when: false
      failed_when: relay_running.stdout.strip() != 'true'

    - name: Verify the CouchDB relay is running
      ansible.builtin.command:
        cmd: /usr/bin/sudo -n /usr/bin/docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' homelab-backup-db-ops-couch-relay
      become: false
      register: couch_relay_running
      changed_when: false
      failed_when: couch_relay_running.stdout.strip() != 'true'
