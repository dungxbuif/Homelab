---
- name: Read-only homelab host audit
  hosts: all
  gather_facts: true
  become: false
  serial: 1
  tasks:
    - name: Read Docker engine summary
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - >-
            {{ '{{' }}.ServerVersion{{ '}}' }} {{ '{{' }}.Swarm.LocalNodeState{{ '}}' }} {{ '{{' }}.Swarm.ControlAvailable{{ '}}' }}
      register: docker_info
      changed_when: false
      check_mode: false

    - name: Read Swarm membership when available
      ansible.builtin.command:
        argv:
          - docker
          - node
          - ls
          - --format
          - >-
            {{ '{{' }}.Hostname{{ '}}' }} {{ '{{' }}.Status{{ '}}' }} {{ '{{' }}.Availability{{ '}}' }}
      register: swarm_nodes
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups['pi5_manager']

    - name: Read active swap devices
      ansible.builtin.command:
        argv:
          - /bin/cat
          - /proc/swaps
      register: swap_status
      changed_when: false
      check_mode: false

    - name: Read root filesystem capacity
      ansible.builtin.command:
        argv:
          - /bin/df
          - -P
          - /
      register: root_disk
      changed_when: false
      check_mode: false

    - name: Read listening sockets
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - -lntup
      register: listening_sockets
      changed_when: false
      check_mode: false

    - name: Read container summaries without configuration secrets
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --all
          - --format
          - >-
            {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}
      register: container_status
      changed_when: false
      check_mode: false

    - name: Read network summaries
      ansible.builtin.command:
        argv:
          - docker
          - network
          - ls
          - --format
          - >-
            {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.Driver{{ '}}' }}\t{{ '{{' }}.Scope{{ '}}' }}
      register: network_status
      changed_when: false
      check_mode: false

    - name: Read one resource sample without streaming
      ansible.builtin.command:
        argv:
          - docker
          - stats
          - --no-stream
          - --format
          - >-
            {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.CPUPerc{{ '}}' }}\t{{ '{{' }}.MemUsage{{ '}}' }}\t{{ '{{' }}.PIDs{{ '}}' }}
      register: container_resources
      changed_when: false
      check_mode: false

    - name: Assemble sanitized host evidence
      ansible.builtin.set_fact:
        audit_record:
          mode: observed
          scope: host_runtime_only
          inventory_complete: false
          observed_at: '{{ ansible_facts.date_time.iso8601 }}'
          host: '{{ inventory_hostname }}'
          role: '{{ automation_host_role | default("unknown") }}'
          distribution: '{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}'
          kernel: '{{ ansible_facts.kernel }}'
          docker_info: '{{ docker_info.stdout | default("") }}'
          swarm_nodes: '{{ swarm_nodes.stdout | default("") }}'
          swap: '{{ swap_status.stdout | default("") }}'
          disk: '{{ root_disk.stdout | default("") }}'
          listening_sockets: '{{ listening_sockets.stdout | default("") }}'
          containers: '{{ container_status.stdout_lines }}'
          networks: '{{ network_status.stdout_lines }}'
          resource_sample: '{{ container_resources.stdout_lines }}'
          memory_mb: '{{ ansible_facts.memtotal_mb }}'

    - name: Emit machine-readable audit record
      ansible.builtin.debug:
        var: audit_record

    - name: Create private controller artifact directory
      ansible.builtin.file:
        path: '{{ audit_artifact_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when: audit_artifact_dir is defined

    - name: Save private host artifact on controller
      ansible.builtin.copy:
        content: '{{ audit_record | to_nice_json }}'
        dest: '{{ audit_artifact_dir }}/{{ inventory_hostname }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      when: audit_artifact_dir is defined
