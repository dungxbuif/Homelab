---
- name: Read the approved backup credentials from the current VM100 owner
  hosts: vm100
  gather_facts: false
  become: true
  tasks:
    - name: Read the runtime credential files without displaying their contents
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - /etc/homelab-backup/secrets/rclone.conf
        - /etc/homelab-backup/secrets/restic-password
        - /etc/homelab-backup/secrets/mezon-webhook
        - /etc/homelab-backup/secrets/postgres-backup.env
        - /etc/homelab-backup/secrets/couchdb-backup-proxy.env
        - /etc/homelab-backup/secrets/rustfs-readonly.env
      register: vm100_backup_credentials
      no_log: true

- name: Install a private DB-operations credential set on VM110
  hosts: db_ops_worker
  gather_facts: false
  become: true
  vars:
    backup_credentials_approved: false
    backup_secret_dir: /etc/homelab-backup/secrets
    backup_secret_map:
      rclone.conf: /etc/homelab-backup/secrets/rclone.conf
      restic-password: /etc/homelab-backup/secrets/restic-password
      mezon-webhook: /etc/homelab-backup/secrets/mezon-webhook
      postgres-backup.env: /etc/homelab-backup/secrets/postgres-backup.env
      couchdb-backup-proxy.env: /etc/homelab-backup/secrets/couchdb-backup-proxy.env
      rustfs-readonly.env: /etc/homelab-backup/secrets/rustfs-readonly.env
  pre_tasks:
    - name: Require explicit credential enrollment approval
      ansible.builtin.assert:
        that: backup_credentials_approved | bool
        fail_msg: >-
          Refusing to copy backup credentials to VM110 without
          backup_credentials_approved=true.
  tasks:
    - name: Allow only the managed service group to traverse the secret parent
      ansible.builtin.file:
        path: /etc/homelab-backup
        state: directory
        owner: root
        group: ubuntu
        mode: '0750'
      become: true

    - name: Create the private credential directory
      ansible.builtin.file:
        path: '{{ backup_secret_dir }}'
        state: directory
        owner: root
        group: ubuntu
        mode: '0750'
      become: true

    - name: Copy approved credentials from VM100 to VM110
      ansible.builtin.copy:
        content: >-
          {{ (hostvars['vm100'].vm100_backup_credentials.results | selectattr('item', 'equalto', item.value) | first).content | b64decode }}
        dest: '{{ backup_secret_dir }}/{{ item.key }}'
        owner: root
        group: ubuntu
        mode: '0640'
      loop: '{{ backup_secret_map | dict2items }}'
      become: true
      no_log: true

    - name: Install the VM110 network-native runner environment
      ansible.builtin.copy:
        dest: /etc/homelab-backup/runner.env
        owner: root
        group: ubuntu
        mode: '0640'
        content: |
          BACKUP_APP_ROOT=/opt/apps/homelab-backup/app
          BACKUP_INVENTORY=/opt/apps/homelab-backup/app/backup/inventory.yaml
          BACKUP_STAGING_ROOT=/opt/apps/homelab-backup/runs
          BACKUP_STATUS_ROOT=/opt/apps/homelab-backup/runs/.state
          BACKUP_LOCK_FILE=/run/lock/homelab-backup.lock
          BACKUP_LOCAL_RCLONE_BIN=/usr/bin/rclone
          RCLONE_CONFIG_FILE=/etc/homelab-backup/secrets/rclone.conf
          RCLONE_CONFIG_WORK_ROOT=/home/ubuntu/.homelab-backup-runtime
          RCLONE_DYNAMIC_LINKER=/lib64/ld-linux-x86-64.so.2
          RCLONE_LIBC=/lib/x86_64-linux-gnu/libc.so.6
          RESTIC_PASSWORD_FILE=/etc/homelab-backup/secrets/restic-password
          MEZON_WEBHOOK_URL_FILE=/etc/homelab-backup/secrets/mezon-webhook
          RCLONE_REMOTE=homelab1
          DRIVE_ROOT=homelab-backups
          BACKUP_POSTGRES_TRANSPORT=network
          BACKUP_POSTGRES_NETWORK=host
          BACKUP_POSTGRES_CLIENT_IMAGE=postgres@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
          BACKUP_POSTGRES_CREDENTIALS_FILE=/etc/homelab-backup/secrets/postgres-backup.env
          BACKUP_POSTGRES_HOST=10.10.0.31
          BACKUP_POSTGRES_PORT=15432
          BACKUP_POSTGRES_USER=backup_ro
          BACKUP_POSTGRES_GLOBALS_TRANSPORT=network
          BACKUP_POSTGRES_GLOBALS_USER=backup_ro
          BACKUP_COUCHDB_TRANSPORT=network-proxy
          BACKUP_COUCHDB_NETWORK=host
          BACKUP_COUCHDB_CLIENT_IMAGE=curlimages/curl@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          BACKUP_COUCHDB_CREDENTIALS_FILE=/etc/homelab-backup/secrets/couchdb-backup-proxy.env
          BACKUP_COUCHDB_ENDPOINT=http://10.10.0.31:15984
          BACKUP_COUCHDB_COMPRESSION=gzip
          BACKUP_HEALTH_REMOTE_PI=false
          BACKUP_RUSTFS_TRANSPORT=network
          BACKUP_RUSTFS_NETWORK=host
          BACKUP_RUSTFS_ENDPOINT=http://10.10.0.5:9000
          RUSTFS_CREDENTIALS_FILE=/etc/homelab-backup/secrets/rustfs-readonly.env
          RUSTFS_CLIENT_IMAGE=amazon/aws-cli@sha256:6b7484ab4ad2f69ae1d3665c91df54e42ab9d2b307f24be08f3a0c59948b8cb9
      become: true
      no_log: true
