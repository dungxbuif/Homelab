---
- name: Stage the backup runtime on the private DB operations worker
  hosts: db_ops_worker
  gather_facts: false
  become: true
  serial: 1
  vars:
    backup_runtime_root: /opt/apps/homelab-backup/app
    backup_runtime_files:
      - backup/inventory.yaml
      - backup/configs-sources.json
      - backup/policies.yaml
      - backup/scripts/common.py
      - backup/scripts/backup-couchdb.py
      - backup/scripts/backup-postgres.py
      - backup/scripts/run-database-backup.py
      - backup/scripts/run-instance-backup.py
      - backup/scripts/validate_inventory.py
      - backup/scripts/cleanup-local-runs.sh
      - backup/scripts/prepare_rclone_workdir.py
      - backup/scripts/restic-lib.sh
      - backup/scripts/run_restic_container.py
      - backup/scripts/upload-restic.sh
      - backup/scripts/stream-couchdb.py
      - backup/scripts/upload-couchdb-stream.sh
      - backup/scripts/restore-couchdb-stream.py
      - backup/scripts/restore-couchdb-stream-snapshots.sh
      - backup/scripts/verify-retention.sh
      - backup/scripts/run-integrity-check.sh
      - backup/scripts/restore-staging.sh
      - backup/scripts/check-backup-health.sh
      - backup/scripts/run-configs-backup.py
      - backup/scripts/validate-config-sources.py
      - backup/scripts/post-check-report.sh
      - backup/scripts/notify-mezon.sh
      - automation/backup-runner/run-class.sh
      - automation/backup-runner/run-vm100-scheduled.sh
      - automation/backup-runner/run-retention.sh
      - automation/backup-runner/run-instance-retention.sh
      - automation/backup-runner/run-config-retention.sh
      - automation/backup-runner/run-restore-drill.sh
      - automation/backup-runner/wait-retention-prerequisites.py
      - automation/backup-runner/schedule.yaml
      - automation/rustfs-backup/export-buckets.py
      - automation/rustfs-backup/restore-bucket.py
      - automation/rustfs-backup/run-rustfs-backup.sh
      - automation/scripts/backup-health-helper.sh
    backup_units:
      - homelab-backup@.service
      - homelab-backup-databases.timer
      - homelab-backup-database-instances.timer
      - homelab-backup-rustfs.timer
      - homelab-backup-retention.timer
      - homelab-backup-configs.timer
      - homelab-backup-health.service
      - homelab-backup-health.timer
      - homelab-backup-restore-drill.service
      - homelab-backup-restore-drill.timer
      - homelab-backup-verify-weekly.service
      - homelab-backup-verify-weekly.timer
    backup_deploy_approved: false
  pre_tasks:
    - name: Require explicit runtime deployment approval
      ansible.builtin.assert:
        that:
          - backup_deploy_approved | bool or ansible_check_mode | bool
        fail_msg: >-
          Refusing to publish backup runtime on VM110 without
          backup_deploy_approved=true.

    - name: Assert this play cannot enable a scheduler
      ansible.builtin.assert:
        that: inventory_hostname in groups['db_ops_worker']

  tasks:
    - name: Create the runtime directory tree
      ansible.builtin.file:
        path: '{{ backup_runtime_root }}/{{ item }}'
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - backup
        - backup/scripts
        - automation
        - automation/backup-runner
        - automation/rustfs-backup
        - automation/scripts

    - name: Create the user-owned staging and status directories
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '{{ item.mode }}'
      become: true
      loop:
        - { path: /opt/apps/homelab-backup/runs, mode: '0750' }
        - { path: /opt/apps/homelab-backup/runs/.state, mode: '0700' }

    - name: Remove stale Python bytecode from previous runtime validation
      ansible.builtin.shell: >-
        /usr/bin/find {{ backup_runtime_root | quote }} -type d
        -name __pycache__ -prune -exec /usr/bin/rm -rf -- {} +
      become: true
      changed_when: true

    - name: Copy the reviewed backup runtime
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../{{ item }}'
        dest: '{{ backup_runtime_root }}/{{ item }}'
        owner: ubuntu
        group: ubuntu
        mode: '{{ "0755" if item.endswith(".sh") else "0644" }}'
      loop: '{{ backup_runtime_files }}'

    - name: Validate the runtime bundle before installing units
      become: false
      ansible.builtin.shell: >-
        python3 -m py_compile
        {{ backup_runtime_root }}/backup/scripts/common.py
        {{ backup_runtime_root }}/backup/scripts/backup-couchdb.py
        {{ backup_runtime_root }}/backup/scripts/backup-postgres.py
        {{ backup_runtime_root }}/backup/scripts/run-database-backup.py
        {{ backup_runtime_root }}/backup/scripts/run-instance-backup.py
        {{ backup_runtime_root }}/backup/scripts/validate_inventory.py
        {{ backup_runtime_root }}/backup/scripts/stream-couchdb.py
        {{ backup_runtime_root }}/backup/scripts/restore-couchdb-stream.py
        {{ backup_runtime_root }}/backup/scripts/run-configs-backup.py
        {{ backup_runtime_root }}/backup/scripts/validate-config-sources.py
        {{ backup_runtime_root }}/backup/scripts/prepare_rclone_workdir.py
        {{ backup_runtime_root }}/backup/scripts/run_restic_container.py
        {{ backup_runtime_root }}/automation/backup-runner/wait-retention-prerequisites.py
        {{ backup_runtime_root }}/automation/rustfs-backup/export-buckets.py
        && bash -n {{ backup_runtime_root }}/automation/backup-runner/run-class.sh
        {{ backup_runtime_root }}/automation/backup-runner/run-vm100-scheduled.sh
        {{ backup_runtime_root }}/automation/backup-runner/run-retention.sh
        {{ backup_runtime_root }}/automation/backup-runner/run-instance-retention.sh
        {{ backup_runtime_root }}/automation/backup-runner/run-config-retention.sh
        {{ backup_runtime_root }}/automation/backup-runner/run-restore-drill.sh
        {{ backup_runtime_root }}/automation/rustfs-backup/run-rustfs-backup.sh
        {{ backup_runtime_root }}/backup/scripts/cleanup-local-runs.sh
        {{ backup_runtime_root }}/backup/scripts/restic-lib.sh
        {{ backup_runtime_root }}/backup/scripts/upload-restic.sh
        {{ backup_runtime_root }}/backup/scripts/upload-couchdb-stream.sh
        {{ backup_runtime_root }}/backup/scripts/restore-couchdb-stream-snapshots.sh
        {{ backup_runtime_root }}/backup/scripts/verify-retention.sh
        {{ backup_runtime_root }}/backup/scripts/run-integrity-check.sh
        {{ backup_runtime_root }}/backup/scripts/restore-staging.sh
        {{ backup_runtime_root }}/backup/scripts/check-backup-health.sh
        {{ backup_runtime_root }}/backup/scripts/post-check-report.sh
        {{ backup_runtime_root }}/backup/scripts/notify-mezon.sh
      changed_when: false

    - name: Install backup units without enabling or starting them
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/systemd/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        owner: root
        group: root
        mode: '0644'
      become: true
      loop: '{{ backup_units }}'

    - name: Reload systemd once after installing backup units
      ansible.builtin.command: /usr/bin/sudo -n /usr/bin/systemctl daemon-reload
      become: false
      changed_when: true

    - name: Ensure every VM110 backup timer remains disabled
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/bin/systemctl
          - disable
          - --now
          - '{{ item }}'
      become: false
      changed_when: true
      loop:
        - homelab-backup-databases.timer
        - homelab-backup-database-instances.timer
        - homelab-backup-rustfs.timer
        - homelab-backup-retention.timer
        - homelab-backup-configs.timer
        - homelab-backup-health.timer
        - homelab-backup-restore-drill.timer
        - homelab-backup-verify-weekly.timer
