---
- name: Repair the existing shared catalog lock without replacing its inode
  hosts: pi5
  gather_facts: false
  become: false
  tasks:
    - name: Require explicit repair approval and fixed host
      ansible.builtin.assert:
        that:
          - backup_catalog_lock_repair_approved | default(false) | bool
          - inventory_hostname == 'pi5'
          - ansible_host == '10.10.0.5'
          - ansible_user == 'dungxbuif'

    - name: Observe exact lock metadata without following symlinks
      ansible.builtin.stat:
        path: /ssd-data/infra/backup-runner/app/backup/.inventory.yaml.lock
        follow: false
        get_checksum: false
      register: catalog_lock_before

    - name: Require existing single-link regular lock with expected ownership
      ansible.builtin.assert:
        that:
          - catalog_lock_before.stat.isreg | default(false)
          - not (catalog_lock_before.stat.islnk | default(true))
          - catalog_lock_before.stat.nlink == 1
          - catalog_lock_before.stat.uid in [0, 1004]
          - catalog_lock_before.stat.gid in [0, 1004]
          - catalog_lock_before.stat.mode == '0600'

    - name: Restore backup account ownership of the existing lock
      become: true
      vars:
        ansible_become: true
        ansible_become_user: root
      ansible.builtin.file:
        path: /ssd-data/infra/backup-runner/app/backup/.inventory.yaml.lock
        state: file
        follow: false
        owner: '1004'
        group: '1004'
        mode: '0600'

    - name: Observe repaired metadata
      ansible.builtin.stat:
        path: /ssd-data/infra/backup-runner/app/backup/.inventory.yaml.lock
        follow: false
        get_checksum: false
      register: catalog_lock_after
      when: not ansible_check_mode

    - name: Verify mutual exclusion still uses the same inode
      ansible.builtin.assert:
        that:
          - catalog_lock_after.stat.inode == catalog_lock_before.stat.inode
          - catalog_lock_after.stat.dev == catalog_lock_before.stat.dev
          - catalog_lock_after.stat.uid == 1004
          - catalog_lock_after.stat.gid == 1004
          - catalog_lock_after.stat.mode == '0600'
      when: not ansible_check_mode
