---
- name: Verify and clean only the reserved Semaphore database fixture
  hosts: pi5
  gather_facts: false
  become: false
  vars:
    pg_acceptance_dir: /tmp/homelab-pg-acceptance-20261015
    pg_acceptance_name: hbverify_pg_20261015_a001
    pg_acceptance_script: semaphore-pg-fixture.py
  tasks:
    - name: Require explicit fixture operation
      ansible.builtin.assert:
        that:
          - pg_acceptance_approved | default(false) | bool
          - pg_acceptance_phase in ['prepare', 'verify', 'cleanup']
          - ansible_user == 'dungxbuif'
          - pg_acceptance_script in ['semaphore-pg-fixture.py', 'semaphore-couch-fixture.py']

    - name: Create private fixture control directory
      ansible.builtin.file:
        path: '{{ pg_acceptance_dir }}/tests'
        state: directory
        mode: '0700'

    - name: Use the deployed backup adapters without modifying them
      ansible.builtin.file:
        src: /ssd-data/infra/backup-runner/app/backup/scripts
        dest: '{{ pg_acceptance_dir }}/scripts'
        state: link

    - name: Install the reviewed fixture control script
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../backup/tests/{{ pg_acceptance_script }}'
        dest: '{{ pg_acceptance_dir }}/tests/{{ pg_acceptance_script }}'
        mode: '0600'

    - name: Execute the selected bounded fixture operation
      ansible.builtin.command:
        argv: >-
          {{ (['sudo', '-S', '-p', ''] if pg_acceptance_phase == 'cleanup' else []) +
          ['python3', pg_acceptance_dir ~ '/tests/' ~ pg_acceptance_script, pg_acceptance_phase,
          '--inventory', '/ssd-data/infra/backup-runner/app/backup/inventory.yaml',
          '--receipt', pg_acceptance_dir ~ '/receipt.json', '--name', pg_acceptance_name] }}
        stdin: '{{ ansible_password if pg_acceptance_phase == "cleanup" else omit }}'
      register: pg_acceptance_result
      changed_when: pg_acceptance_phase != 'verify'
      no_log: '{{ pg_acceptance_phase == "cleanup" }}'

    - name: Report secret-safe fixture result
      ansible.builtin.debug:
        var: pg_acceptance_result.stdout_lines
