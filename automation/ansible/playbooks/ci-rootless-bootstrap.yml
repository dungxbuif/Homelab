---
- name: Bootstrap the isolated CI Docker daemon
  hosts: all
  become: true
  gather_facts: true
  vars:
    ci_user: homelab-ci
    ci_script_version: v28.5.2
    ci_script_sha256:
      dockerd-rootless.sh: bfb8adb8edd55819492c4a11a506c2621e39a3a8c2ae447231ecae2ee7fa803f
      dockerd-rootless-setuptool.sh: 0172d6f5c301b764a41bc37453d7bfd29c7681c02d3ece9ab109e7d04b52acc2
    ci_bin: /usr/local/lib/homelab-ci
  tasks:
    - name: Require explicit enrollment on VM100 only
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == 'vm100-prod'
          - ci_bootstrap_approved | default(false) | bool

    - name: Install rootless prerequisites without changing Docker packages
      ansible.builtin.apt:
        name: [uidmap, slirp4netns, rootlesskit, fuse-overlayfs, acl, dbus-user-session]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create dedicated unprivileged CI account
      ansible.builtin.user:
        name: '{{ ci_user }}'
        shell: /bin/bash
        create_home: true
        password_lock: true
        groups: ''
        append: false

    - name: Resolve CI user identity
      ansible.builtin.getent:
        database: passwd
        key: '{{ ci_user }}'
      when: not ansible_check_mode

    - name: Read current subordinate identity allocations
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop: [/etc/subuid, /etc/subgid]
      register: ci_subid_files

    - name: Reject unknown allocations before expanding the CI identity range
      ansible.builtin.assert:
        that:
          - (item.content | b64decode).splitlines() | reject('match', '^(ubuntu:100000:65536|homelab-ci:165536:(65536|1048576))$') | list | length == 0
      loop: '{{ ci_subid_files.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Allocate enough CI identities for nested rootless containers
      ansible.builtin.lineinfile:
        path: '{{ item }}'
        regexp: '^homelab-ci:'
        line: 'homelab-ci:165536:1048576'
      loop: [/etc/subuid, /etc/subgid]
      register: ci_subids

    - name: Create rootless script directory
      ansible.builtin.file:
        path: '{{ ci_bin }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Provide the CLI alongside the upstream setup script
      ansible.builtin.file:
        src: /usr/bin/docker
        dest: '{{ ci_bin }}/docker'
        state: link

    - name: Install version-pinned upstream rootless scripts
      ansible.builtin.get_url:
        url: 'https://raw.githubusercontent.com/moby/moby/{{ ci_script_version }}/contrib/{{ item }}'
        dest: '{{ ci_bin }}/{{ item }}'
        checksum: 'sha256:{{ ci_script_sha256[item] }}'
        owner: root
        group: root
        mode: '0755'
      loop: [dockerd-rootless.sh, dockerd-rootless-setuptool.sh]
      when: not ansible_check_mode

    - name: Observe current CI persistence in logind
      ansible.builtin.command:
        argv: [loginctl, show-user, '{{ ci_user }}', '--property=Linger', '--value']
      register: ci_linger
      changed_when: false
      failed_when: ci_linger.rc not in [0, 1]
      check_mode: false

    - name: Enable persistent user services
      ansible.builtin.command:
        argv: [loginctl, enable-linger, '{{ ci_user }}']
      when: ci_linger.stdout | trim != 'yes'
      changed_when: true

    - name: Verify logind keeps the CI user persistent
      ansible.builtin.command:
        argv: [loginctl, show-user, '{{ ci_user }}', '--property=Linger', '--value']
      register: ci_linger_verified
      changed_when: false
      failed_when: ci_linger_verified.stdout | trim != 'yes'
      when: not ansible_check_mode

    - name: Configure and start rootless services
      when: not ansible_check_mode
      block:
        - name: Create user slice override directory
          ansible.builtin.file:
            path: '/etc/systemd/system/user-{{ getent_passwd[ci_user][1] }}.slice.d'
            state: directory
            mode: '0755'

        - name: Limit the entire CI user workload
          ansible.builtin.copy:
            dest: '/etc/systemd/system/user-{{ getent_passwd[ci_user][1] }}.slice.d/limits.conf'
            mode: '0644'
            content: |
              [Slice]
              MemoryMax=4G
              CPUQuota=200%
              TasksMax=4096

        - name: Create CI user manager override directory
          ansible.builtin.file:
            path: '/etc/systemd/system/user@{{ getent_passwd[ci_user][1] }}.service.d'
            state: directory
            mode: '0755'

        - name: Delegate resource controllers to CI only
          ansible.builtin.copy:
            dest: '/etc/systemd/system/user@{{ getent_passwd[ci_user][1] }}.service.d/delegate.conf'
            mode: '0644'
            content: |
              [Service]
              Delegate=cpu cpuset io memory pids
          register: ci_delegate

        - name: Start user systemd manager
          ansible.builtin.systemd_service:
            name: 'user@{{ getent_passwd[ci_user][1] }}.service'
            state: '{{ "restarted" if ci_delegate.changed else "started" }}'
            daemon_reload: true
          register: ci_manager
          retries: 3
          delay: 3
          until: ci_manager is succeeded

        - name: Install rootless daemon alongside production Docker
          become: true
          become_user: '{{ ci_user }}'
          ansible.builtin.command:
            argv: ['{{ ci_bin }}/dockerd-rootless-setuptool.sh', install, --force]
            creates: '/home/{{ ci_user }}/.config/systemd/user/docker.service'
          environment:
            PATH: '{{ ci_bin }}:/usr/local/bin:/usr/bin:/bin'
            HOME: '/home/{{ ci_user }}'
            XDG_RUNTIME_DIR: '/run/user/{{ getent_passwd[ci_user][1] }}'
            DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ getent_passwd[ci_user][1] }}/bus'

        - name: Ensure the rootless daemon is enabled and running
          become: true
          become_user: '{{ ci_user }}'
          ansible.builtin.systemd_service:
            name: docker.service
            scope: user
            enabled: true
            state: '{{ "restarted" if ci_subids.changed else "started" }}'
          environment:
            XDG_RUNTIME_DIR: '/run/user/{{ getent_passwd[ci_user][1] }}'
            DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ getent_passwd[ci_user][1] }}/bus'

        - name: Verify daemon reports rootless security
          become: true
          become_user: '{{ ci_user }}'
          ansible.builtin.command:
            argv: [docker, info, --format, '{{ "{{json .SecurityOptions}}" }}']
          environment:
            DOCKER_HOST: 'unix:///run/user/{{ getent_passwd[ci_user][1] }}/docker.sock'
          register: ci_security
          changed_when: false
          failed_when: ci_security.rc != 0 or 'rootless' not in ci_security.stdout
