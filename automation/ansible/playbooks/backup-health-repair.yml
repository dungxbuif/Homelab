---
- name: Install bounded cross-host backup health reporting
  hosts: all
  gather_facts: false
  become: false
  serial: 1
  vars:
    health_app_root: '{{ "/ssd-data/infra/backup-runner/app" if inventory_hostname == "pi5" else "/opt/apps/homelab-backup/app" }}'
  tasks:
    - name: Require explicit health-only repair approval
      ansible.builtin.assert:
        that:
          - backup_health_repair_approved | default(false) | bool
          - inventory_hostname in ['pi5', 'vm100']

    - name: Install health script with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../backup/scripts/check-backup-health.sh'
        dest: '{{ health_app_root }}/backup/scripts/check-backup-health.sh'
        mode: '0755'
        backup: true

    - name: Install restricted Pi command handlers and compatibility aliases
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/{{ item }}'
        dest: '{{ item.dest }}'
        mode: '0755'
        backup: true
      loop:
        - src: pi-executor.sh
          dest: /home/dungxbuif/.local/sbin/pi-executor.sh
        - src: pi-executor.sh
          dest: /home/dungxbuif/.local/sbin/homelab-backup-executor
        - src: pi-ssh-guard.sh
          dest: /home/dungxbuif/.local/sbin/pi-ssh-guard.sh
        - src: pi-ssh-guard.sh
          dest: /home/dungxbuif/.local/sbin/homelab-backup-ssh-guard
      when: inventory_hostname == 'pi5'

    - name: Install the Pi configuration exporter with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/export-configs-pi.sh'
        dest: '{{ health_app_root }}/automation/backup-runner/export-configs-pi.sh'
        mode: '0755'
        backup: true
      when: inventory_hostname == 'pi5'

    - name: Install the bounded Pi backup runner with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/run-pi-capped.sh'
        dest: '{{ health_app_root }}/automation/backup-runner/run-pi-capped.sh'
        mode: '0755'
        backup: true
      when: inventory_hostname == 'pi5'

    - name: Install the monitoring target audit on VM100
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../maintenance/audit-monitoring-targets.py'
        dest: /opt/apps/homelab-backup/app/automation/maintenance/audit-monitoring-targets.py
        mode: '0755'
        backup: true
      when: inventory_hostname == 'vm100'

    - name: Install the monitoring drift report on VM100 after its dependency
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../maintenance/run-monitoring-drift-report.sh'
        dest: /opt/apps/homelab-backup/app/automation/maintenance/run-monitoring-drift-report.sh
        mode: '0755'
        backup: true
      when: inventory_hostname == 'vm100'

    - name: Require both monitoring drift files before enabling the timer
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /opt/apps/homelab-backup/app/automation/maintenance/audit-monitoring-targets.py
        - /opt/apps/homelab-backup/app/automation/maintenance/run-monitoring-drift-report.sh
      register: monitoring_drift_files
      when: inventory_hostname == 'vm100'

    - name: Fail closed if the monitoring drift release is incomplete
      ansible.builtin.assert:
        that:
          - item.stat.exists | bool
          - item.stat.isreg | bool
          - item.stat.executable | bool
        fail_msg: 'Monitoring drift release is incomplete: {{ item.item }}'
      loop: '{{ monitoring_drift_files.results | default([]) }}'
      when: inventory_hostname == 'vm100'

    - name: Install the monitoring drift systemd units on VM100
      vars:
        ansible_become: true
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../maintenance/systemd/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        mode: '0644'
        backup: true
      loop:
        - homelab-monitoring-drift.service
        - homelab-monitoring-drift.timer
      become: true
      when: inventory_hostname == 'vm100'
      notify: Reload systemd definitions

    - name: Enable the monitoring drift timer on VM100
      vars:
        ansible_become: true
      ansible.builtin.systemd_service:
        name: homelab-monitoring-drift.timer
        enabled: true
        state: started
        daemon_reload: true
      become: true
      when: inventory_hostname == 'vm100'

    - name: Install only the corrected health service
      vars:
        ansible_become: true
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/systemd/homelab-backup-health.service'
        dest: /etc/systemd/system/homelab-backup-health.service
        mode: '0644'
        backup: true
      become: true
      when: inventory_hostname == 'vm100'
      notify: Reload systemd definitions

  handlers:
    - name: Reload systemd definitions
      vars:
        ansible_become: true
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
