---
- name: Install bounded cross-host backup health reporting
  hosts: all
  gather_facts: false
  become: false
  serial: 1
  vars:
    health_app_root: '{{ "/ssd-data/infra/backup-runner/app" if inventory_hostname == "pi5" else "/opt/apps/homelab-backup/app" }}'
  tasks:
    - name: Require explicit health-only repair approval
      ansible.builtin.assert:
        that:
          - backup_health_repair_approved | default(false) | bool
          - inventory_hostname in ['pi5', 'vm100']

    - name: Install health script with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../../backup/scripts/check-backup-health.sh'
        dest: '{{ health_app_root }}/backup/scripts/check-backup-health.sh'
        mode: '0755'
        backup: true

    - name: Install restricted Pi command handlers and compatibility aliases
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/{{ item }}'
        dest: '{{ item.dest }}'
        mode: '0755'
        backup: true
      loop:
        - src: pi-executor.sh
          dest: /home/dungxbuif/.local/sbin/pi-executor.sh
        - src: pi-executor.sh
          dest: /home/dungxbuif/.local/sbin/homelab-backup-executor
        - src: pi-ssh-guard.sh
          dest: /home/dungxbuif/.local/sbin/pi-ssh-guard.sh
        - src: pi-ssh-guard.sh
          dest: /home/dungxbuif/.local/sbin/homelab-backup-ssh-guard
      when: inventory_hostname == 'pi5'

    - name: Install the Pi configuration exporter with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/export-configs-pi.sh'
        dest: '{{ health_app_root }}/automation/backup-runner/export-configs-pi.sh'
        mode: '0755'
        backup: true
      when: inventory_hostname == 'pi5'

    - name: Install the bounded Pi backup runner with rollback copy
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/run-pi-capped.sh'
        dest: '{{ health_app_root }}/automation/backup-runner/run-pi-capped.sh'
        mode: '0755'
        backup: true
      when: inventory_hostname == 'pi5'

    - name: Install only the corrected health service
      vars:
        ansible_become: true
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../backup-runner/systemd/homelab-backup-health.service'
        dest: /etc/systemd/system/homelab-backup-health.service
        mode: '0644'
        backup: true
      become: true
      when: inventory_hostname == 'vm100'
      notify: Reload systemd definitions

  handlers:
    - name: Reload systemd definitions
      vars:
        ansible_become: true
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
