---
- name: Install prerequisite-aware backup retention without interrupting jobs
  hosts: vm100
  gather_facts: false
  become: false
  tasks:
    - name: Require explicit approval and the intended scheduler host
      ansible.builtin.assert:
        that:
          - backup_retention_gate_approved | default(false) | bool
          - inventory_hostname == 'vm100'
          - ansible_host == '10.10.0.31'

    - name: Observe current backup job states before installing
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - homelab-backup@databases.service
          - homelab-backup@gitlab.service
          - homelab-backup@rustfs.service
          - homelab-backup@retention.service
          - --property=ActiveState
          - --property=LoadState
      register: backup_gate_job_states
      changed_when: false
      check_mode: false

    - name: Refuse to replace the scheduler while backup jobs are live
      ansible.builtin.assert:
        that:
          - backup_gate_job_states.stdout_lines | reject('equalto', '') | list | length == 8
          - backup_gate_job_states.stdout_lines | select('equalto', 'LoadState=loaded') | list | length == 4
          - >-
            backup_gate_job_states.stdout_lines |
            reject('in', ['', 'LoadState=loaded', 'ActiveState=inactive', 'ActiveState=failed']) | list | length == 0
        fail_msg: A backup operation is active or its state is unknown; finish observing that operation before deploying.

    - name: Freeze scheduler source content before deriving release identity
      ansible.builtin.set_fact:
        scheduler_wrapper_content: '{{ lookup("file", playbook_dir + "/../../backup-runner/run-vm100-scheduled.sh", rstrip=false) }}'
        scheduler_gate_content: '{{ lookup("file", playbook_dir + "/../../backup-runner/wait-retention-prerequisites.py", rstrip=false) }}'

    - name: Derive immutable scheduler release directory
      ansible.builtin.set_fact:
        scheduler_release_dir: >-
          /opt/apps/homelab-backup/scheduler-releases/{{ [scheduler_wrapper_content, scheduler_gate_content] | to_json | hash('sha256') }}

    - name: Create immutable release directory
      ansible.builtin.file:
        path: '{{ scheduler_release_dir }}'
        state: directory
        mode: '0755'

    - name: Install complete scheduler generation without overwriting existing content
      ansible.builtin.copy:
        content: '{{ item.content }}'
        dest: '{{ scheduler_release_dir }}/{{ item.name }}'
        mode: '0444'
        force: false
      loop:
        - name: run-vm100-scheduled.sh
          content: '{{ scheduler_wrapper_content }}'
        - name: wait-retention-prerequisites.py
          content: '{{ scheduler_gate_content }}'
      loop_control:
        label: '{{ item.name }}'

    - name: Read installed generation checksums
      ansible.builtin.stat:
        path: '{{ scheduler_release_dir }}/{{ item }}'
        checksum_algorithm: sha256
        follow: false
      loop: [run-vm100-scheduled.sh, wait-retention-prerequisites.py]
      register: scheduler_release_files
      when: not ansible_check_mode

    - name: Require exact immutable content before publication
      ansible.builtin.assert:
        that:
          - scheduler_release_files.results[0].stat.isreg
          - scheduler_release_files.results[1].stat.isreg
          - scheduler_release_files.results[0].stat.checksum == scheduler_wrapper_content | hash('sha256')
          - scheduler_release_files.results[1].stat.checksum == scheduler_gate_content | hash('sha256')
      when: not ansible_check_mode

    - name: Atomically publish scheduler launcher with a rollback copy
      ansible.builtin.template:
        src: '{{ playbook_dir | dirname }}/templates/backup-scheduler-launcher.sh.j2'
        dest: /opt/apps/homelab-backup/app/automation/backup-runner/run-vm100-scheduled.sh
        mode: '0755'
        backup: true
        validate: /bin/bash -n %s
