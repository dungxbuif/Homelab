---
- name: Enroll restricted host observer on approved Linux hosts
  hosts: pi5:vm100
  gather_facts: false
  vars:
    ansible_become: true
    ansible_become_exe: '{{ "/usr/bin/sudo.ws" if inventory_hostname == "pi5" else "/usr/bin/sudo" }}'
    observer_profiles:
      vm100:
        address: 10.10.0.31
        owner: ubuntu
        guard: host-audit-ssh-guard.sh
      pi5:
        address: 10.10.0.5
        owner: dungxbuif
        guard: host-audit-pi-ssh-guard.sh
  tasks:
    - name: Require approved enrollment and one public key
      ansible.builtin.assert:
        that:
          - host_audit_enrollment_approved | default(false) | bool
          - inventory_hostname in observer_profiles
          - ansible_host == observer_profiles[inventory_hostname].address
          - >-
            host_audit_public_key is match('^ssh-ed25519 [A-Za-z0-9+/=]+(?: [^\r\n]*)?$')

    - name: Create observer without supplementary groups
      ansible.builtin.user:
        name: homelab-observer
        system: true
        create_home: true
        shell: /bin/sh
        password_lock: true
        groups: ''

    - name: Create root-owned helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install fixed command guard
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/{{ observer_profiles[inventory_hostname].guard }}'
        dest: /usr/local/libexec/homelab-host-audit-guard
        owner: root
        group: root
        mode: '0755'

    - name: Install isolated Python observer
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/host-observer.py'
        dest: /usr/local/libexec/homelab-host-observer
        owner: root
        group: root
        mode: '0755'

    - name: Allow exact observer without arguments as Docker owner
      ansible.builtin.copy:
        dest: /etc/sudoers.d/homelab-host-observer
        content: |
          homelab-observer ALL=({{ observer_profiles[inventory_hostname].owner }}) NOPASSWD: /usr/local/libexec/homelab-host-observer ""
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Root-manage identity home and SSH directory
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /home/homelab-observer
        - /home/homelab-observer/.ssh

    - name: Install forced-command public key
      ansible.builtin.copy:
        dest: /home/homelab-observer/.ssh/authorized_keys
        owner: root
        group: root
        mode: '0644'
        content: >-
          restrict,command="/usr/local/libexec/homelab-host-audit-guard" {{ host_audit_public_key }}
