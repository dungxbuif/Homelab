---
- name: Controlled VM100 Docker package transition
  hosts: vm100
  gather_facts: false
  become: true
  vars:
    docker_rollback_dir: /var/backups/homelab/docker-pre-ce-20261014
    docker_ce_packages:
      - docker-ce=5:29.8.2-1~ubuntu.22.04~jammy
      - docker-ce-cli=5:29.8.2-1~ubuntu.22.04~jammy
      - docker-ce-rootless-extras=5:29.8.2-1~ubuntu.22.04~jammy
      - containerd.io=2.2.6-1~ubuntu.22.04~jammy
      - docker-buildx-plugin=0.38.0-1~ubuntu.22.04~jammy
      - docker-compose-plugin=5.6.0-1~ubuntu.22.04~jammy
  tasks:
    - name: Require checkpoint and idle CI confirmation
      ansible.builtin.assert:
        that:
          - docker_upgrade_approved | default(false) | bool
          - docker_checkpoint_verified | default(false) | bool
          - docker_ci_idle_verified | default(false) | bool

    - name: Read current engine version
      ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
      register: engine_before
      changed_when: false

    - name: Require known source version
      ansible.builtin.assert:
        that:
          - engine_before.stdout == '29.1.3'

    - name: Create protected rollback directory
      ansible.builtin.file:
        path: '{{ docker_rollback_dir }}'
        state: directory
        mode: '0700'

    - name: Download existing packages for emergency rollback
      ansible.builtin.command:
        argv:
          - apt-get
          - download
          - docker.io=29.1.3-0ubuntu3~22.04.2
          - containerd=2.2.1-0ubuntu1~22.04.2
          - runc=1.3.4-0ubuntu1~22.04.1
          - docker-buildx=0.30.1-0ubuntu1~22.04.1
          - rootlesskit=0.14.6-1ubuntu1.1
          - docker-compose-v2=2.40.3+ds1-0ubuntu1~22.04.1
        chdir: '{{ docker_rollback_dir }}'
      changed_when: true

    - name: Capture running production container IDs
      ansible.builtin.command: docker ps --format '{{ "{{.ID}} {{.Names}}" }}'
      register: containers_before
      changed_when: false

    - name: Save pre-upgrade container inventory
      ansible.builtin.copy:
        content: '{{ containers_before.stdout }}\n'
        dest: '{{ docker_rollback_dir }}/containers-before.txt'
        mode: '0600'

    - name: Preserve engine configuration with private permissions
      ansible.builtin.command:
        argv: [tar, -czf, '{{ docker_rollback_dir }}/engine-config.tar.gz', /etc/docker, /etc/containerd]
      changed_when: true

    - name: Pre-download exact replacement packages while apps are running
      ansible.builtin.command:
        argv: '{{ ["apt-get", "--download-only", "-y", "install"] + docker_ce_packages }}'
      changed_when: true

    - name: Stop idle rootless CI daemon before replacing shared binaries
      ansible.builtin.command:
        argv: [runuser, -u, homelab-ci, --, env, XDG_RUNTIME_DIR=/run/user/1001, systemctl, --user, stop, docker.service]
      changed_when: true

    - name: Remove conflicting Ubuntu Compose CLI without purging configuration
      ansible.builtin.apt:
        name: docker-compose-v2
        state: absent
        purge: false
        autoremove: false

    - name: Stop old production service and socket together
      ansible.builtin.command:
        argv: [systemctl, stop, docker.service, docker.socket]
      changed_when: true

    - name: Install exact official engine packages without purging data
      ansible.builtin.apt:
        name: '{{ docker_ce_packages }}'
        state: present
        autoremove: false
        purge: false
        dpkg_options: force-confdef,force-confold
        policy_rc_d: 101
      environment:
        NEEDRESTART_MODE: l

    - name: Reload unit definitions and start the new activation socket
      ansible.builtin.systemd_service:
        name: docker.socket
        daemon_reload: true
        state: started
        enabled: true

    - name: Ensure production Docker is started
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Restart rootless CI daemon with updated binaries
      ansible.builtin.command:
        argv: [runuser, -u, homelab-ci, --, env, XDG_RUNTIME_DIR=/run/user/1001, systemctl, --user, start, docker.service]
      changed_when: true

    - name: Verify upgraded server version
      ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
      register: engine_after
      changed_when: false
      retries: 12
      delay: 5
      until: engine_after.rc == 0 and engine_after.stdout == '29.8.2'

    - name: Report engine result for subsequent application checks
      ansible.builtin.debug:
        msg: 'Engine {{ engine_after.stdout }} started; application and overlay checks are still required.'
