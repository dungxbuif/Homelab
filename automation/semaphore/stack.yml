version: "3.9"

services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.12
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB_PATH: /var/lib/semaphore
      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: dungbui.dungbui.00@gmail.com
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD_FILE: /run/secrets/semaphore_admin_password
      SEMAPHORE_ACCESS_KEY_ENCRYPTION_FILE: /run/secrets/semaphore_access_key_encryption
      SEMAPHORE_LDAP_ACTIVATED: "no"
      SEMAPHORE_USE_REMOTE_RUNNER: "true"
      TZ: Asia/Ho_Chi_Minh
    secrets:
      - semaphore_admin_password
      - semaphore_access_key_encryption
      - homelab_provisioner_token
    volumes:
      - /ssd-data/infra/semaphore/data:/var/lib/semaphore
      - /ssd-data/infra/semaphore/repository:/tmp/semaphore-repository:ro
      - /ssd-data/infra/semaphore/playbooks:/tmp/semaphore:rw
    networks:
      - homelab-control-net
    dns:
      - 10.10.0.5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == rpivn
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure

secrets:
  semaphore_admin_password:
    external: true
  semaphore_access_key_encryption:
    external: true
  homelab_provisioner_token:
    external: true

networks:
  homelab-control-net:
    external: true
