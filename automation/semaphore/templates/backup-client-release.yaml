---
name: backup-client-release
description: Release the reviewed five-file backup client on Pi5 under its existing backup lock.
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: Semaphore inventory 6 (Pi5 backup client release)
workspace: automation
variables:
  - name: backup_client_release_approved
    type: boolean
    required: true
    default: false
  - name: change_message
    type: string
    required: true
approval:
  required: true
  roles: [Manager]
command: >-
  ANSIBLE_CONFIG=automation/ansible/ansible.cfg ansible-playbook
  automation/semaphore/playbooks/backup-client-release.yml --limit pi5
  -e backup_client_release_approved=${backup_client_release_approved}
post_check:
  command: test -s artifacts/backup-client-release.json
  artifact: artifacts/backup-client-release.json
