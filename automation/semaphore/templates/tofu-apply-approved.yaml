---
name: tofu-apply-approved
description: Apply only the reviewed VM100 OpenTofu plan artifact.
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: automation/tofu/proxmox
workspace: automation/tofu/proxmox
variables:
  - name: target
    type: enum
    required: true
    values: [vm100]
  - name: approved_plan_id
    type: artifact_id
    required: true
  - name: change_message
    type: string
    required: true
approval:
  required: true
  roles: [Manager]
command: tofu -chdir=automation/tofu/proxmox apply artifacts/vm100.tfplan
post_check:
  command: tofu -chdir=automation/tofu/proxmox plan -detailed-exitcode
  artifact: artifacts/vm100-post-apply.txt
