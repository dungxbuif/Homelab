---
name: host-audit
description: Read-only inventory, resource, Docker, Swarm, network, disk, swap, and SSH audit.
availability: design_only
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: automation/ansible/inventories/production/hosts.yml
workspace: automation
variables:
  - name: target
    type: enum
    required: true
    values: [all, gateway, pi5_manager, vm100_worker]
  - name: change_message
    type: string
    required: true
approval:
  required: false
  roles: [Viewer, Task Runner, Manager]
command: ansible-playbook automation/ansible/playbooks/audit.yml --limit ${target} --check
post_check:
  command: test -s artifacts/host-audit.json
  artifact: artifacts/host-audit.json
