---
name: backup-audit
description: Read-only audit of backup timers, markers, and staging capacity.
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: automation/ansible/inventories/production/hosts.yml
workspace: automation
approval:
  required: false
  roles: [Viewer, Task Runner, Manager]
command: >-
  ANSIBLE_CONFIG=automation/ansible/ansible.cfg ansible-playbook
  automation/ansible/playbooks/backup-audit.yml --limit pi5,vm100
  -e "audit_artifact_dir=$PWD/artifacts"
post_check:
  command: test -s artifacts/backup-pi5.json && test -s artifacts/backup-vm100.json
  artifacts: [artifacts/backup-pi5.json, artifacts/backup-vm100.json]
