version: 1
timezone: Asia/Ho_Chi_Minh
lock: /run/lock/homelab-backup.lock
templates:
  - name: db-backup
    schedule: "0 1 * * *"
    command: "run-class.sh databases db-{utc_timestamp}"
  - name: gitlab-backup
    schedule: "30 2 * * *"
    command: "run-class.sh gitlab gitlab-{utc_timestamp} {completed_vm100_run}"
  - name: rustfs-backup
    schedule: "30 4 * * *"
    command: "run-class.sh rustfs rustfs-{utc_timestamp}"
  - name: backup-retention
    schedule: "30 5 * * *"
    command: "run-retention.sh"
