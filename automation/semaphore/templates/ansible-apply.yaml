---
name: ansible-apply
description: Apply an approved host baseline change one managed host at a time.
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: automation/ansible/inventories/production/hosts.yml
workspace: automation
variables:
  - name: target
    type: enum
    required: true
    values: [gateway, pi5_manager, vm100_worker]
  - name: approved_plan_id
    type: artifact_id
    required: true
  - name: change_message
    type: string
    required: true
approval:
  required: true
  roles: [Manager]
command: ANSIBLE_CONFIG=automation/ansible/ansible.cfg ansible-playbook automation/ansible/playbooks/bootstrap.yml --limit ${target} -e automation_apply_baseline=true
post_check:
  command: ANSIBLE_CONFIG=automation/ansible/ansible.cfg ansible-playbook automation/ansible/playbooks/audit.yml --limit ${target}
  artifact: artifacts/post-check.json
