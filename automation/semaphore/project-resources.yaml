---
name: homelab-automation
repository:
  url: ssh://git@gitlab.dungxbuif.com:2222/dungxbuif/homelab-automation.git
  revision: main
  protected_revisions:
    - main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
  allow_mutable_tags: false
environments:
  - name: OpenTofu VM100 controlled credentials
    required_secret_env:
      - TF_VAR_proxmox_api_token
      - TF_VAR_state_encryption_passphrase
    required_file_env:
      - SSL_CERT_FILE
    host_mapping:
      pve: 10.10.0.20
roles:
  - name: Viewer
    allowed_templates:
      - ansible-check
      - tofu-plan
      - backup-audit
  - name: Task Runner
    allowed_templates:
      - ansible-check
      - tofu-plan
      - backup-audit
      - route-publish
  - name: Manager
    allowed_templates:
      - ansible-check
      - ansible-apply
      - tofu-plan
      - tofu-apply-approved
      - backup-audit
      - route-publish
      - backup-client-release
operator_policy:
  private_ui_only: true
  provisioner_public_route: false
  docker_socket_mount: false
  required_post_check: true
  require_plan_artifact_for_apply: true
  backup_schedule_owner: systemd-backup-runner
