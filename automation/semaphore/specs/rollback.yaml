# DESIGN SPEC ONLY - not a live Semaphore template. See specs/README.md.
---
name: rollback
description: Roll one allow-listed application back to a recorded immutable image digest.
availability: design_only
repository: homelab-automation
revision: main
execution_image:
  repository: registry-gitlab.dungxbuif.com/dungxbuif/homelab-automation/automation-ee
  digest_variable: AUTOMATION_EE_IMAGE_DIGEST
  immutable: true
inventory: automation/stacks
workspace: automation/stacks
variables:
  - name: service_id
    type: enum
    required: true
    values: [homepage, relayhub, gitlab, macocr-proxy, mypocket, stirling-pdf, openclaw, n8n]
  - name: rollback_image_digest
    type: image_digest
    required: true
  - name: change_message
    type: string
    required: true
approval:
  required: true
  roles: [Manager]
command: automation/scripts/rollback-service --service ${service_id} --image ${rollback_image_digest}
post_check:
  command: automation/scripts/smoke-service --service ${service_id} --environment production
  artifact: artifacts/${service_id}-rollback-post-check.json
