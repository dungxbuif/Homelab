---
- name: Check combined backup health through a forced-command identity
  hosts: backup_scheduler
  gather_facts: false
  become: false
  vars:
    ansible_ssh_use_tty: false
  tasks:
    - name: Run the only allowed remote command
      ansible.builtin.raw: backup-health
      register: backup_health
      changed_when: false
      failed_when: false

    - name: Show backup health evidence
      ansible.builtin.debug:
        msg:
          exit_code: '{{ backup_health.rc }}'
          stdout: '{{ backup_health.stdout | default("") }}'
          stderr: '{{ backup_health.stderr | default("") }}'

    - name: Require healthy backup state
      ansible.builtin.assert:
        that:
          - backup_health.rc == 0
        fail_msg: Backup health is not clean; inspect the evidence above.
