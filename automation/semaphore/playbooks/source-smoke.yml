---
- name: Verify authenticated GitLab checkout and private control connectivity
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require the pinned runner toolchain when requested
      ansible.builtin.assert:
        that:
          - ansible_version.full == '2.18.6'
      when: verify_remote_runner | default(false) | bool

    - name: Read executor identity
      ansible.builtin.command:
        argv: [id, '-u']
      register: executor_uid
      changed_when: false

    - name: Require the nonprivileged remote runner identity when requested
      ansible.builtin.assert:
        that:
          - executor_uid.stdout == '1001'
      when: verify_remote_runner | default(false) | bool

    - name: Read checked-out commit
      ansible.builtin.command:
        argv: [git, -C, '{{ playbook_dir }}', rev-parse, HEAD]
      register: source_commit
      changed_when: false

    - name: Locate expected runtime policy
      ansible.builtin.stat:
        path: '{{ playbook_dir }}/../../policies/active-runtime.yaml'
      register: source_policy

    - name: Require real source checkout
      ansible.builtin.assert:
        that:
          - source_commit.stdout is match('^[0-9a-f]{40}$')
          - source_policy.stat.isreg | default(false)

    - name: Verify private provisioner health without credentials
      ansible.builtin.uri:
        url: http://homelab-provisioner_provisioner:8787/healthz
        return_content: true
        status_code: 200
        timeout: 10
      register: provisioner_health

    - name: Require healthy response body
      ansible.builtin.assert:
        that:
          - provisioner_health.json.status == 'ok'

    - name: Verify GitLab HTTPS from executor
      ansible.builtin.uri:
        url: https://gitlab.dungxbuif.com/users/sign_in
        validate_certs: true
        status_code: 200
        timeout: 15

    - name: Report narrow smoke scope
      ansible.builtin.debug:
        msg:
          commit: '{{ source_commit.stdout }}'
          scope: authenticated_source_and_control_connectivity
          database_mutations: false
          host_audit: not_run
          ansible_core: '{{ ansible_version.full }}'
          executor_uid: '{{ executor_uid.stdout }}'
