---
- name: Provision one database and enroll it in backup coverage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    provisioner_url: "{{ lookup('env', 'PROVISIONER_URL') | default('http://homelab-provisioner_provisioner:8787', true) }}"
    provisioner_token_file: /run/secrets/homelab_provisioner_token
    provision_request:
      engine: "{{ engine }}"
      name: "{{ database_name }}"
      application: "{{ application }}"
      environment: "{{ target_environment }}"
      policy_id: "{{ policy_id }}"
      secret_ref: "{{ secret_ref }}"
  tasks:
    - name: Reject accidental credential input before the HTTP call
      ansible.builtin.assert:
        that:
          - password is not defined
          - password_ref is not defined
        fail_msg: "Passwords are generated by the private provisioner and cannot be supplied to this job"

    - name: Add PostgreSQL owner field
      ansible.builtin.set_fact:
        provision_request: "{{ provision_request | combine({'owner_role': owner_role}) }}"
      when: engine == 'postgresql'

    - name: Add CouchDB identity field
      ansible.builtin.set_fact:
        provision_request: "{{ provision_request | combine({'owner_identity': owner_identity}) }}"
      when: engine == 'couchdb'

    - name: Read the private provisioner token
      ansible.builtin.set_fact:
        provisioner_token: "{{ lookup('file', provisioner_token_file) | trim }}"
      no_log: true

    - name: Provision database and update the backup catalog
      ansible.builtin.uri:
        url: "{{ provisioner_url }}/v1/provision"
        method: POST
        headers:
          Authorization: "Bearer {{ provisioner_token }}"
          Content-Type: application/json
        body_format: json
        body: "{{ provision_request }}"
        status_code: [200, 201]
        return_content: true
      register: provision_response
      changed_when: provision_response.status == 201
      no_log: true

    - name: Show secret-safe result
      ansible.builtin.debug:
        msg: >-
          Provisioned {{ provision_response.json.result.engine }} resource
          {{ provision_response.json.result.name }}
          (changed={{ provision_response.json.result.changed }})
