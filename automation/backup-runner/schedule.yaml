timezone: Asia/Ho_Chi_Minh
lock: /run/lock/homelab-backup.lock
jobs:
  - name: databases
    schedule: "0 1 * * *"
    command: run-class.sh databases db-{utc_timestamp}
  - name: gitlab
    schedule: "30 2 * * *"
    command: run-class.sh gitlab gitlab-{utc_timestamp} /path/from/vm100/native-run/complete
  - name: rustfs
    schedule: "30 4 * * *"
    command: run-class.sh rustfs rustfs-{utc_timestamp}
  - name: retention
    schedule: "30 5 * * *"
    command: run-retention.sh
