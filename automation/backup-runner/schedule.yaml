timezone: Asia/Ho_Chi_Minh
lock: /run/lock/homelab-backup.lock
jobs:
  - name: databases
    schedule: "0 1 * * *"
    command: run-class.sh databases db-{utc_timestamp}
  - name: database-instances
    schedule: "30 1 * * *"
    command: run-class.sh database-instances database-instances-{utc_timestamp}
  - name: gitlab
    schedule: "30 2 * * *"
    command: run-class.sh gitlab gitlab-{utc_timestamp} /path/from/vm100/native-run/complete
  - name: rustfs
    schedule: "0 2 * * *"
    command: run-class.sh rustfs rustfs-{utc_timestamp}
  - name: configs
    schedule: "0 9 * * *"
    command: run-class.sh configs configs-{utc_timestamp}
    enabled: false
  - name: retention
    schedule: "30 6 * * *"
    command: run-retention.sh
