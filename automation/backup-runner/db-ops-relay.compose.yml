services:
  db-ops-postgres-relay:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: homelab-backup-db-ops-postgres-relay
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=4m
      - /var/run:size=1m
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    networks: [pg-net]
    ports:
      - "10.10.0.31:15432:15432"
    volumes:
      - ./postgres-nginx.conf:/etc/nginx/nginx.conf:ro

  db-ops-couch-relay:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: homelab-backup-db-ops-couch-relay
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=4m
      - /var/run:size=1m
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    volumes:
      - ./couch-nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  pg-net:
    external: true
